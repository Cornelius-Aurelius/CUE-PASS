<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07140d" />
  <title>CUE PASS — Colour Blind Football Game</title>
  <style>
    :root {
      --bg: #07140d;
      --grass-1: #12351f;
      --grass-2: #0e2a19;
      --white: #f8f8f0;
      --black: #101010;
      --panel: rgba(248, 248, 240, 0.96);
      --line: rgba(255,255,255,0.72);
      --shadow: rgba(0,0,0,0.35);
      --soft: rgba(255,255,255,0.18);
      --kit-a: #d7d7d1;
      --kit-b: #c6d0d1;
      --kit-c: #e5decf;
      --kit-d: #bfc3bd;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(42, 96, 58, 0.9), transparent 42%),
        var(--bg);
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 980px);
      min-height: min(900px, calc(100svh - 20px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .topbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 1000;
      letter-spacing: 0.08em;
      font-size: clamp(0.85rem, 3vw, 1.05rem);
    }

    .brand-ball {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--white);
      color: var(--black);
      box-shadow: 0 10px 22px var(--shadow);
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 48vw;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.2);
    }

    .dot.done {
      background: var(--white);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
    }

    .game {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      min-height: 620px;
    }

    .cue-wrap {
      display: grid;
      place-items: center;
      z-index: 5;
    }

    .cue-card {
      width: min(92vw, 330px);
      min-height: 122px;
      padding: 10px 12px;
      border-radius: 30px;
      border: 5px solid var(--white);
      background: var(--panel);
      color: var(--black);
      box-shadow: 0 18px 35px rgba(0,0,0,0.28);
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 4px;
    }

    .cue-side {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      background: var(--black);
      color: var(--white);
      display: grid;
      place-items: center;
      font-size: 24px;
    }

    .cue-main {
      min-height: 100px;
      display: grid;
      place-items: center;
    }

    .cue-arrow {
      font-size: 32px;
      font-weight: 1000;
      opacity: 0.78;
    }

    .pitch {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      border-radius: 34px;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow:
        inset 0 0 0 5px rgba(255,255,255,0.72),
        0 22px 52px rgba(0,0,0,0.36);
      background:
        linear-gradient(90deg, transparent 0 49.3%, rgba(255,255,255,0.5) 49.3% 50.7%, transparent 50.7% 100%),
        repeating-linear-gradient(90deg, var(--grass-1) 0 88px, var(--grass-2) 88px 176px);
      touch-action: manipulation;
    }

    .pitch::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(46vw, 250px);
      height: min(46vw, 250px);
      transform: translate(-50%, -50%);
      border: 4px solid var(--line);
      border-radius: 50%;
      opacity: 0.76;
    }

    .pitch::after {
      content: "";
      position: absolute;
      inset: 7% 6%;
      border: 3px solid rgba(255,255,255,0.44);
      border-radius: 24px;
      pointer-events: none;
    }

    .player-btn {
      appearance: none;
      border: 0;
      background: transparent;
      position: absolute;
      width: clamp(94px, 19vw, 132px);
      height: clamp(136px, 26vw, 178px);
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      filter: drop-shadow(0 16px 16px rgba(0,0,0,0.35));
      z-index: 3;
    }

    .player-btn:focus-visible,
    .circle-btn:focus-visible {
      outline: 5px solid var(--white);
      outline-offset: 8px;
      border-radius: 28px;
    }

    .player-btn.hint .player-card {
      animation: hintGlow 1.05s ease-in-out infinite;
    }

    .player-btn.good .player-card {
      animation: goodPop 0.55s ease both;
    }

    .player-btn.bad .player-card {
      animation: badShake 0.36s ease both;
    }

    .player-card,
    .mini-card,
    .me-card {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .shadow {
      position: absolute;
      bottom: 2px;
      left: 50%;
      width: 74%;
      height: 17px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0,0,0,0.32);
      filter: blur(2px);
    }

    .legs {
      position: absolute;
      left: 50%;
      bottom: 17px;
      width: 58px;
      height: 52px;
      transform: translateX(-50%);
    }

    .leg {
      position: absolute;
      top: 0;
      width: 19px;
      height: 44px;
      border-radius: 10px 10px 12px 12px;
      background: #141718;
      border: 2px solid rgba(255,255,255,0.88);
    }

    .leg.left { left: 8px; transform: rotate(7deg); }
    .leg.right { right: 8px; transform: rotate(-7deg); }

    .boot {
      position: absolute;
      bottom: -6px;
      width: 27px;
      height: 13px;
      border-radius: 14px 14px 8px 8px;
      background: var(--white);
      border: 3px solid var(--black);
      overflow: hidden;
    }

    .boot.left { left: -3px; transform: rotate(-7deg); }
    .boot.right { right: -3px; transform: rotate(7deg); }

    .boots-dots .boot::after,
    .boots-bars .boot::after,
    .boots-half .boot::after,
    .boots-cross .boot::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
    }

    .boots-dots .boot::after {
      background: radial-gradient(circle, #111 0 2px, transparent 2.5px) 0 0 / 8px 8px;
    }

    .boots-bars .boot::after {
      background: repeating-linear-gradient(90deg, #111 0 3px, transparent 3px 7px);
    }

    .boots-half .boot::after {
      background: linear-gradient(90deg, #111 0 50%, transparent 50% 100%);
    }

    .boots-cross .boot::after {
      background:
        linear-gradient(45deg, transparent 0 42%, #111 42% 58%, transparent 58% 100%),
        linear-gradient(-45deg, transparent 0 42%, #111 42% 58%, transparent 58% 100%);
    }

    .body {
      position: absolute;
      left: 50%;
      bottom: 58px;
      width: 76px;
      height: 80px;
      transform: translateX(-50%);
      border-radius: 24px 24px 30px 30px;
      border: 4px solid var(--black);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.28);
      background: var(--kit-a);
    }

    .kit-a { background: var(--kit-a); }
    .kit-b { background: var(--kit-b); }
    .kit-c { background: var(--kit-c); }
    .kit-d { background: var(--kit-d); }

    .pattern-stripes::before,
    .pattern-hoops::before,
    .pattern-sash::before,
    .pattern-check::before,
    .pattern-dot::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.96;
    }

    .pattern-stripes::before {
      background: repeating-linear-gradient(90deg, transparent 0 12px, rgba(0,0,0,0.43) 12px 20px);
    }

    .pattern-hoops::before {
      background: repeating-linear-gradient(0deg, transparent 0 13px, rgba(0,0,0,0.45) 13px 21px);
    }

    .pattern-sash::before {
      background: linear-gradient(135deg, transparent 0 36%, rgba(0,0,0,0.48) 36% 58%, transparent 58% 100%);
    }

    .pattern-check::before {
      background:
        linear-gradient(45deg, rgba(0,0,0,0.43) 25%, transparent 25% 75%, rgba(0,0,0,0.43) 75%),
        linear-gradient(45deg, rgba(0,0,0,0.43) 25%, transparent 25% 75%, rgba(0,0,0,0.43) 75%);
      background-size: 18px 18px;
      background-position: 0 0, 9px 9px;
    }

    .pattern-dot::before {
      background: radial-gradient(circle, rgba(0,0,0,0.48) 0 4px, transparent 4.6px) 0 0 / 18px 18px;
    }

    .number {
      position: relative;
      z-index: 2;
      width: 47px;
      height: 47px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--white);
      border: 4px solid var(--black);
      color: var(--black);
      font-size: 25px;
      font-weight: 1000;
      line-height: 1;
    }

    .armband {
      position: absolute;
      top: 28px;
      width: 17px;
      height: 34px;
      border-radius: 14px;
      background: #111;
      border: 3px solid var(--white);
      z-index: 3;
      box-shadow: 0 0 0 2px #111;
    }

    .arm-left .armband { left: -8px; }
    .arm-right .armband { right: -8px; }

    .head {
      position: absolute;
      left: 50%;
      bottom: 132px;
      width: 50px;
      height: 50px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #c79d7c;
      border: 4px solid var(--black);
      z-index: 4;
    }

    .skin-dark .head { background: #805238; }
    .skin-light .head { background: #d8ae8a; }

    .hair {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--black);
      z-index: 2;
    }

    .hair-flat {
      top: -8px;
      width: 43px;
      height: 17px;
      border-radius: 22px 22px 7px 7px;
    }

    .hair-spikes {
      top: -15px;
      width: 44px;
      height: 28px;
      background: transparent;
    }

    .hair-spikes::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--black);
      clip-path: polygon(0 100%, 10% 28%, 22% 100%, 37% 8%, 52% 100%, 67% 20%, 82% 100%, 100% 28%, 100% 100%);
    }

    .hair-band {
      top: 5px;
      width: 48px;
      height: 11px;
      border-radius: 999px;
    }

    .hair-mohawk {
      top: -19px;
      width: 18px;
      height: 32px;
      border-radius: 18px 18px 4px 4px;
    }

    .eyes {
      position: absolute;
      top: 23px;
      left: 50%;
      width: 25px;
      height: 6px;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
    }

    .eyes::before,
    .eyes::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--black);
    }

    .me {
      position: absolute;
      left: 50%;
      bottom: 32px;
      width: clamp(94px, 18vw, 126px);
      height: clamp(132px, 24vw, 170px);
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 16px 14px rgba(0,0,0,0.28));
    }

    .me .body {
      background: var(--white);
    }

    .ball {
      position: absolute;
      left: 50%;
      bottom: 36px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: var(--white);
      border: 4px solid var(--black);
      transform: translateX(-50%);
      z-index: 9;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 13px rgba(0,0,0,0.28);
      transition:
        left 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
        bottom 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
        transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .ball::after {
      content: "";
      width: 14px;
      height: 14px;
      background: var(--black);
      clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%);
    }

    .flash {
      position: absolute;
      left: 50%;
      top: 47%;
      width: 88px;
      height: 88px;
      transform: translate(-50%, -50%) scale(0.8);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(248,248,240,0.98);
      color: var(--black);
      border: 5px solid var(--black);
      font-size: 52px;
      font-weight: 1000;
      box-shadow: 0 18px 38px rgba(0,0,0,0.34);
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    .flash.show {
      animation: flashPop 0.72s ease both;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(7, 20, 13, 0.84);
      backdrop-filter: blur(7px);
    }

    .overlay.hidden {
      display: none;
    }

    .panel {
      width: min(92vw, 440px);
      border-radius: 36px;
      border: 5px solid var(--white);
      background: var(--panel);
      color: var(--black);
      box-shadow: 0 26px 62px rgba(0,0,0,0.44);
      padding: 22px;
      display: grid;
      place-items: center;
      gap: 18px;
      text-align: center;
    }

    .title {
      font-size: clamp(2.45rem, 11vw, 4.9rem);
      font-weight: 1000;
      line-height: 0.84;
      letter-spacing: -0.065em;
    }

    .visual-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      font-size: clamp(2rem, 10vw, 3.8rem);
      line-height: 1;
    }

    .tiny {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(0.78rem, 3vw, 0.94rem);
      font-weight: 1000;
      letter-spacing: 0.05em;
    }

    .circle-btn {
      appearance: none;
      border: 0;
      min-width: 82px;
      height: 72px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--black);
      color: var(--white);
      display: inline-grid;
      place-items: center;
      font-size: 33px;
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.28);
    }

    .bottom-bar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .small-btn {
      width: 58px;
      min-width: 58px;
      height: 58px;
      padding: 0;
      border: 2px solid rgba(255,255,255,0.75);
      font-size: 24px;
    }

    .cue-number {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--white);
      color: var(--black);
      border: 6px solid var(--black);
      box-shadow: 0 0 0 5px rgba(0,0,0,0.08);
      font-size: 56px;
      font-weight: 1000;
      line-height: 1;
    }

    .cue-boots {
      position: relative;
      width: 132px;
      height: 78px;
    }

    .cue-boots .boot {
      width: 62px;
      height: 30px;
      bottom: 20px;
    }

    .cue-boots .boot.left { left: 4px; }
    .cue-boots .boot.right { right: 4px; }

    .cue-head {
      position: relative;
      width: 98px;
      height: 98px;
      border-radius: 50%;
      background: #c79d7c;
      border: 6px solid var(--black);
    }

    .cue-head.skin-dark { background: #805238; }
    .cue-head.skin-light { background: #d8ae8a; }
    .cue-head .hair { transform: translateX(-50%) scale(1.55); }
    .cue-head .eyes { top: 47px; transform: translateX(-50%) scale(1.25); }

    .cue-shirt {
      position: relative;
      width: 98px;
      height: 104px;
      border-radius: 25px 25px 32px 32px;
      background: var(--kit-a);
      border: 6px solid var(--black);
      overflow: hidden;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.25);
    }

    .cue-shirt .armband {
      top: 31px;
      width: 18px;
      height: 38px;
    }

    .cue-shirt.arm-left .armband { left: -1px; }
    .cue-shirt.arm-right .armband { right: -1px; }

    .mini-card {
      width: 102px;
      height: 114px;
      transform: scale(0.98);
    }

    .mini-card .shadow,
    .mini-card .legs {
      display: none;
    }

    .mini-card .head {
      bottom: 74px;
      width: 41px;
      height: 41px;
    }

    .mini-card .body {
      bottom: 18px;
      width: 70px;
      height: 70px;
    }

    .mini-card .number {
      width: 0;
      height: 0;
      border: 0;
      overflow: hidden;
      opacity: 0;
    }

    @keyframes hintGlow {
      0%, 100% { filter: drop-shadow(0 16px 16px rgba(0,0,0,0.35)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 24px rgba(255,255,255,0.98)); transform: scale(1.04); }
    }

    @keyframes goodPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.13); filter: drop-shadow(0 0 22px rgba(255,255,255,0.95)); }
      100% { transform: scale(1); }
    }

    @keyframes badShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-6px); }
    }

    @keyframes flashPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.82); }
    }

    @media (max-width: 680px) {
      body { padding: 8px; }
      .app { min-height: calc(100svh - 16px); gap: 8px; }
      .topbar { min-height: 48px; }
      .brand-ball { width: 36px; height: 36px; }
      .dots { gap: 5px; }
      .dot { width: 12px; height: 12px; }
      .game { min-height: 560px; gap: 8px; }
      .cue-card {
        width: min(94vw, 306px);
        min-height: 108px;
        border-radius: 25px;
        grid-template-columns: 37px 1fr 37px;
      }
      .cue-side { width: 37px; height: 37px; border-radius: 14px; font-size: 22px; }
      .cue-main { min-height: 88px; }
      .cue-arrow { font-size: 27px; }
      .pitch { min-height: 500px; border-radius: 28px; }
      .player-btn { width: 88px; height: 132px; }
      .body { width: 64px; height: 68px; bottom: 47px; border-width: 4px; }
      .head { width: 42px; height: 42px; bottom: 109px; }
      .legs { bottom: 12px; transform: translateX(-50%) scale(0.9); }
      .number { width: 40px; height: 40px; font-size: 22px; border-width: 3px; }
      .armband { top: 23px; height: 29px; width: 15px; }
      .me { width: 88px; height: 124px; bottom: 26px; }
      .me .body { bottom: 46px; }
      .me .head { bottom: 108px; }
      .ball { bottom: 31px; width: 31px; height: 31px; }
      .cue-number { width: 78px; height: 78px; font-size: 48px; }
      .cue-boots { transform: scale(0.9); }
      .cue-head { transform: scale(0.88); }
      .cue-shirt { transform: scale(0.86); }
      .panel { border-radius: 30px; padding: 20px; }
    }

    @media (max-height: 720px) and (orientation: landscape) {
      body { place-items: start center; }
      .app { min-height: auto; }
      .game {
        grid-template-columns: minmax(190px, 300px) 1fr;
        grid-template-rows: 1fr;
        min-height: 420px;
      }
      .cue-wrap { align-self: center; }
      .pitch { min-height: 420px; }
      .topbar,
      .bottom-bar { min-height: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="CUE PASS colour blind football decision game">
    <header class="topbar">
      <div class="brand" aria-label="Cue Pass">
        <div class="brand-ball" aria-hidden="true">⚽</div>
        <span>CUE PASS</span>
      </div>
      <div class="dots" id="dots" aria-label="round progress"></div>
    </header>

    <section class="game">
      <div class="cue-wrap">
        <div class="cue-card" aria-label="look at the visual cue then pass to the matching player">
          <div class="cue-side" aria-hidden="true">👀</div>
          <div class="cue-main" id="cueMain"></div>
          <div class="cue-arrow" aria-hidden="true">➜</div>
        </div>
      </div>

      <div class="pitch" id="pitch" aria-label="football pitch">
        <button class="player-btn" id="p0" aria-label="pass option one"></button>
        <button class="player-btn" id="p1" aria-label="pass option two"></button>
        <button class="player-btn" id="p2" aria-label="pass option three"></button>

        <div class="me" id="me" aria-hidden="true"></div>
        <div class="ball" id="ball" aria-hidden="true"></div>
        <div class="flash" id="flash" aria-hidden="true">✓</div>

        <div class="overlay" id="startOverlay">
          <div class="panel">
            <div class="title">CUE<br>PASS</div>
            <div class="visual-rule" aria-hidden="true">👀 ➜ 🎯 ➜ ⚽</div>
            <div class="tiny">LESS COLOUR · MORE CUES</div>
            <button class="circle-btn" id="startBtn" aria-label="start game">▶</button>
          </div>
        </div>

        <div class="overlay hidden" id="endOverlay">
          <div class="panel">
            <div class="title">✓ ✓ ✓</div>
            <div class="visual-rule" aria-hidden="true">👀 ⚽ 🧠</div>
            <div class="tiny">CUES FIRST</div>
            <button class="circle-btn" id="againBtn" aria-label="play again">↻</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="bottom-bar">
      <button class="circle-btn small-btn" id="resetBtn" aria-label="reset game">↻</button>
      <button class="circle-btn small-btn" id="soundBtn" aria-label="sound on">🔈</button>
    </footer>
  </main>

  <script>
    const TOTAL_ROUNDS = 8;
    const positions = [
      { left: 25, bottom: 54 },
      { left: 75, bottom: 54 },
      { left: 50, bottom: 74 }
    ];

    const players = [
      { number: 7, kit: "kit-a", pattern: "pattern-stripes", hair: "hair-spikes", skin: "skin-light", boots: "boots-dots", arm: "arm-left" },
      { number: 9, kit: "kit-b", pattern: "pattern-hoops", hair: "hair-flat", skin: "skin-dark", boots: "boots-bars", arm: "arm-right" },
      { number: 4, kit: "kit-c", pattern: "pattern-sash", hair: "hair-mohawk", skin: "", boots: "boots-half", arm: "arm-left" },
      { number: 3, kit: "kit-d", pattern: "pattern-check", hair: "hair-band", skin: "skin-light", boots: "boots-cross", arm: "arm-right" },
      { number: 8, kit: "kit-a", pattern: "pattern-dot", hair: "hair-flat", skin: "", boots: "boots-dots", arm: "arm-left" },
      { number: 5, kit: "kit-b", pattern: "pattern-stripes", hair: "hair-spikes", skin: "skin-dark", boots: "boots-half", arm: "arm-right" }
    ];

    const roundPlan = [
      "number",
      "number",
      "hair",
      "boots",
      "armband",
      "pattern",
      "number",
      "mixed"
    ];

    let round = 0;
    let target = 0;
    let cue = "number";
    let current = [];
    let locked = false;
    let soundOn = true;
    let mistakeCount = 0;

    const dots = document.getElementById("dots");
    const cueMain = document.getElementById("cueMain");
    const pitch = document.getElementById("pitch");
    const ball = document.getElementById("ball");
    const flash = document.getElementById("flash");
    const startOverlay = document.getElementById("startOverlay");
    const endOverlay = document.getElementById("endOverlay");
    const startBtn = document.getElementById("startBtn");
    const againBtn = document.getElementById("againBtn");
    const resetBtn = document.getElementById("resetBtn");
    const soundBtn = document.getElementById("soundBtn");
    const buttons = [0, 1, 2].map(i => document.getElementById(`p${i}`));
    const me = document.getElementById("me");

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderDots() {
      dots.innerHTML = "";
      for (let i = 0; i < TOTAL_ROUNDS; i++) {
        const dot = document.createElement("div");
        dot.className = "dot" + (i < round ? " done" : "");
        dots.appendChild(dot);
      }
    }

    function playerMarkup(player, mode = "player-card") {
      return `
        <div class="${mode} ${player.skin}">
          <div class="shadow"></div>
          <div class="head">
            <div class="hair ${player.hair}"></div>
            <div class="eyes"></div>
          </div>
          <div class="body ${player.kit} ${player.pattern} ${player.arm}">
            <div class="armband"></div>
            <div class="number">${player.number}</div>
          </div>
          <div class="legs ${player.boots}">
            <div class="leg left"><div class="boot left"></div></div>
            <div class="leg right"><div class="boot right"></div></div>
          </div>
        </div>
      `;
    }

    function renderPlayers() {
      buttons.forEach((btn, i) => {
        btn.className = "player-btn";
        btn.style.left = `${positions[i].left}%`;
        btn.style.bottom = `${positions[i].bottom}%`;
        btn.innerHTML = playerMarkup(current[i]);
      });
    }

    function renderCue(player) {
      if (cue === "number") {
        cueMain.innerHTML = `<div class="cue-number">${player.number}</div>`;
        return;
      }

      if (cue === "hair") {
        cueMain.innerHTML = `
          <div class="cue-head ${player.skin}">
            <div class="hair ${player.hair}"></div>
            <div class="eyes"></div>
          </div>
        `;
        return;
      }

      if (cue === "boots") {
        cueMain.innerHTML = `
          <div class="cue-boots ${player.boots}">
            <div class="boot left"></div>
            <div class="boot right"></div>
          </div>
        `;
        return;
      }

      if (cue === "armband") {
        cueMain.innerHTML = `
          <div class="cue-shirt ${player.kit} ${player.arm}">
            <div class="armband"></div>
          </div>
        `;
        return;
      }

      if (cue === "pattern") {
        cueMain.innerHTML = `
          <div class="cue-shirt ${player.kit} ${player.pattern}"></div>
        `;
        return;
      }

      cueMain.innerHTML = playerMarkup(player, "mini-card");
    }

    function resetBall() {
      ball.style.left = "50%";
      ball.style.bottom = "36px";
      ball.style.transform = "translateX(-50%) scale(1)";
    }

    function startRound() {
      locked = false;
      mistakeCount = 0;
      renderDots();
      resetBall();
      buttons.forEach(btn => btn.classList.remove("hint", "good", "bad"));

      if (round >= TOTAL_ROUNDS) {
        endOverlay.classList.remove("hidden");
        return;
      }

      cue = roundPlan[round];
      current = shuffle(players).slice(0, 3);
      target = Math.floor(Math.random() * 3);
      renderCue(current[target]);
      renderPlayers();

      if (round < 2) {
        buttons[target].classList.add("hint");
        setTimeout(() => buttons[target]?.classList.remove("hint"), 1700);
      }
    }

    function showFlash(symbol) {
      flash.textContent = symbol;
      flash.classList.remove("show");
      void flash.offsetWidth;
      flash.classList.add("show");
    }

    function tone(type) {
      if (!soundOn) return;
      try {
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "sine";
        osc.frequency.value = type === "good" ? 680 : 145;
        gain.gain.setValueAtTime(0.001, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audio.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.18);
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + 0.2);
      } catch (error) {}
    }

    function passBall(btn) {
      const pitchRect = pitch.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      const x = btnRect.left + btnRect.width / 2 - pitchRect.left;
      const yFromBottom = pitchRect.bottom - (btnRect.top + btnRect.height * 0.62);
      ball.style.left = `${x}px`;
      ball.style.bottom = `${yFromBottom}px`;
      ball.style.transform = "translateX(-50%) scale(0.86)";
    }

    function choose(index) {
      if (locked) return;
      buttons.forEach(btn => btn.classList.remove("hint"));

      if (index === target) {
        locked = true;
        buttons[index].classList.add("good");
        passBall(buttons[index]);
        showFlash("✓");
        tone("good");
        if (navigator.vibrate) navigator.vibrate(28);
        setTimeout(() => {
          round++;
          startRound();
        }, 760);
        return;
      }

      mistakeCount++;
      buttons[index].classList.add("bad");
      showFlash("✕");
      tone("bad");
      if (navigator.vibrate) navigator.vibrate([24, 24, 24]);
      setTimeout(() => buttons[index].classList.remove("bad"), 420);

      if (mistakeCount >= 1) {
        setTimeout(() => {
          if (!locked) buttons[target].classList.add("hint");
        }, 380);
      }
    }

    function newGame() {
      round = 0;
      endOverlay.classList.add("hidden");
      startRound();
    }

    function begin() {
      startOverlay.classList.add("hidden");
      newGame();
    }

    buttons.forEach((btn, i) => btn.addEventListener("click", () => choose(i)));
    startBtn.addEventListener("click", begin);
    againBtn.addEventListener("click", newGame);
    resetBtn.addEventListener("click", newGame);
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? "🔈" : "🔇";
      soundBtn.setAttribute("aria-label", soundOn ? "sound on" : "sound off");
    });

    me.innerHTML = playerMarkup({
      number: 12,
      kit: "kit-a",
      pattern: "pattern-hoops",
      hair: "hair-flat",
      skin: "",
      boots: "boots-dots",
      arm: "arm-left"
    }, "me-card");

    renderDots();
    current = shuffle(players).slice(0, 3);
    target = 0;
    cue = "number";
    renderCue(current[target]);
    renderPlayers();
  </script>
</body>
</html>
