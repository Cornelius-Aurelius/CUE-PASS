<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 5%,#1f6b3b88,transparent 42%),linear-gradient(#082414,#06130c);color:white;overflow-x:hidden}body{min-height:100svh;display:grid;place-items:center;padding:8px}button{font:inherit;cursor:pointer}.app{width:min(100%,980px);min-height:calc(100svh - 16px);display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;align-content:start}.top{width:min(100%,760px);justify-self:center;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:8px;font-weight:1000}.brand span{width:30px;height:30px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.dot{width:11px;height:11px;border-radius:50%;border:2px solid #fffd;background:#fff3}.dot.done{background:#fff;box-shadow:inset 0 0 0 3px #111}.score{min-width:58px;height:34px;border:2px solid #fff8;border-radius:999px;background:#fff2;display:grid;place-items:center;font-weight:1000}.cue{width:min(94vw,390px);justify-self:center;min-height:94px;border-radius:28px;background:var(--card);color:var(--ink);display:grid;grid-template-columns:52px 1fr 56px;align-items:center;gap:8px;padding:8px 10px;border:4px solid #fff;box-shadow:0 16px 35px #0005}.cueIcon{width:44px;height:44px;border-radius:16px;background:#111;color:#fff;display:grid;place-items:center;font-size:25px}.cueMain{min-height:76px;display:grid;place-items:center}.hint{position:relative;width:48px;height:48px;border-radius:18px;border:2.5px solid #111;background:#fff;color:#111;font-size:24px;display:grid;place-items:center;opacity:.88;animation:soft 2.8s infinite}.hint:before{content:"?";position:absolute;right:-5px;top:-6px;width:18px;height:18px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:1000;border:2px solid #fff}.wrap{width:min(100%,760px);justify-self:center}.pitch{position:relative;width:100%;height:clamp(405px,56svh,525px);min-height:405px;border-radius:28px;overflow:hidden;background:linear-gradient(90deg,transparent 0 49.2%,#fff8 49.2% 50.8%,transparent 50.8%),repeating-linear-gradient(90deg,var(--pa) 0 88px,var(--pb) 88px 176px);box-shadow:inset 0 0 0 4px #fffb,0 18px 48px #0006;border:2px solid #fff4;touch-action:manipulation}.pitch:before{content:"";position:absolute;left:50%;top:50%;width:min(33vw,190px);height:min(33vw,190px);transform:translate(-50%,-50%);border:4px solid #fffb;border-radius:50%;opacity:.75}.pitch:after{content:"";position:absolute;inset:7% 6%;border:2.5px solid #fff7;border-radius:18px}.zone{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:1;color:#ffffff2e;font-weight:1000;font-size:clamp(1.2rem,4vw,2.3rem);pointer-events:none}.btn{appearance:none;border:0;background:transparent;padding:0;position:absolute;left:var(--x);top:var(--y);width:var(--ps);height:calc(var(--ps)*1.38);transform:translate(-50%,-50%);display:grid;place-items:center;z-index:4;filter:drop-shadow(0 14px 11px #0006)}.btn.glow{filter:drop-shadow(0 0 16px #fff) drop-shadow(0 14px 11px #0006)}.btn.ok .player{animation:yes .48s}.btn.no .player{animation:no .38s}.player{position:relative;width:100%;height:100%}.shadow{position:absolute;bottom:0;width:74%;height:11%;left:13%;border-radius:50%;background:#0005;filter:blur(3px)}.head{position:absolute;left:50%;top:3%;transform:translateX(-50%);width:39%;aspect-ratio:1;border-radius:50%;background:#bd8d6d;border:4px solid #111;z-index:5}.skin-light{background:#d2a37f}.skin-deep{background:#7e5039}.neck{position:absolute;left:50%;bottom:-11%;width:28%;height:19%;transform:translateX(-50%);background:inherit;border-left:3px solid #111;border-right:3px solid #111}.hair{position:absolute;left:50%;transform:translateX(-50%);background:#111;z-index:7}.hair-flat{top:-10%;width:92%;height:35%;border-radius:24px 24px 9px 9px}.hair-spike{top:-23%;width:86%;height:43%;background:transparent}.hair-spike:before{content:"";position:absolute;inset:0;background:#111;clip-path:polygon(0 100%,10% 26%,23% 100%,38% 14%,52% 100%,68% 24%,82% 100%,100% 30%,100% 100%)}.hair-band{top:10%;width:95%;height:24%;border-radius:999px}.hair-mohawk{top:-42%;width:34%;height:64%;border-radius:999px 999px 8px 8px}.shirt{position:absolute;left:50%;top:34%;transform:translateX(-50%);width:68%;height:45%;border-radius:21% 21% 29% 29%;background:#e6e6e6;border:4px solid #111;box-shadow:inset 0 0 0 4px #fff4;overflow:hidden;display:grid;place-items:center;z-index:3}.shirt:after{content:"";position:absolute;left:50%;top:0;width:32%;height:14%;transform:translateX(-50%);border-radius:0 0 999px 999px;background:#111;z-index:2}.kit-light{background:#e8e3d6}.kit-mid{background:#bfcbd0}.kit-dark{background:#9f9f9f}.pattern-stripes:before,.pattern-hoops:before,.pattern-sash:before,.pattern-check:before{content:"";position:absolute;inset:0}.pattern-stripes:before{background:repeating-linear-gradient(90deg,transparent 0 11px,#0007 11px 19px)}.pattern-hoops:before{background:repeating-linear-gradient(0deg,transparent 0 12px,#0007 12px 20px)}.pattern-sash:before{background:linear-gradient(135deg,transparent 0 36%,#0008 36% 58%,transparent 58%)}.pattern-check:before{background:linear-gradient(45deg,#0007 25%,transparent 25% 75%,#0007 75%),linear-gradient(45deg,#0007 25%,transparent 25% 75%,#0007 75%);background-size:18px 18px;background-position:0 0,9px 9px}.num{position:relative;z-index:4;color:#fff;font-weight:1000;font-size:calc(var(--ps)*.34);line-height:.82;-webkit-text-stroke:3px #111;text-shadow:0 4px 0 #111}.band{position:absolute;top:31%;width:19%;height:44%;border-radius:999px;background:#111;border:3px solid #fff;z-index:5}.band-left{left:-9%}.band-right{right:-9%}.legs{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:55%;height:36%;z-index:2}.leg{position:absolute;top:0;width:34%;height:77%;border-radius:999px;background:#111;border:3px solid #fffe}.leg.l{left:8%;transform:rotate(7deg)}.leg.r{right:8%;transform:rotate(-7deg)}.boot{position:absolute;bottom:-29%;width:230%;height:50%;background:#fff;border:5px solid #111;border-radius:999px;overflow:hidden}.leg.l .boot{left:-78%;transform:rotate(-7deg)}.leg.r .boot{right:-78%;transform:rotate(7deg)}.boots-dots .boot:after,.boots-stripes .boot:after,.boots-half .boot:after,.boots-cross .boot:after{content:"";position:absolute;inset:2px;border-radius:inherit}.boots-dots .boot:after{background:radial-gradient(circle,#111 0 4px,transparent 4.4px) 0 0/14px 14px}.boots-stripes .boot:after{background:repeating-linear-gradient(90deg,#111 0 8px,transparent 8px 15px)}.boots-half .boot:after{background:linear-gradient(90deg,#111 0 50%,transparent 50%)}.boots-cross .boot:after{background:linear-gradient(45deg,transparent 0 35%,#111 35% 65%,transparent 65%),linear-gradient(-45deg,transparent 0 35%,#111 35% 65%,transparent 65%)}.bootBadge{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);width:94%;height:29%;border-radius:999px;background:#fffe;border:4px solid #111;display:none;place-items:center;grid-template-columns:1fr 1fr;gap:2px;padding:5px;z-index:25;box-shadow:0 8px 18px #0005}.bBoot{width:100%;height:100%;border-radius:999px;background:#fff;border:3px solid #111;position:relative;overflow:hidden}.bootRound .bootBadge{display:grid}.bootRound .num{opacity:.22}.bootRound .shirt{opacity:.78}.bootRound .boot{box-shadow:0 0 0 4px #fffe,0 0 18px #fff}.self{position:absolute;left:var(--sx);top:var(--sy);width:var(--ss);height:calc(var(--ss)*1.38);transform:translate(-50%,-50%);z-index:3;pointer-events:none;filter:drop-shadow(0 12px 9px #0006)}.self .shirt{background:#fff}.self .num{font-size:calc(var(--ss)*.31)}.ball{position:absolute;left:var(--bx);top:var(--by);width:clamp(30px,4.3vw,38px);aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid #111;z-index:8;display:grid;place-items:center;transform:translate(-50%,-50%);transition:.42s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 14px #0005}.ball:after{content:"";width:45%;aspect-ratio:1;background:#111;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}.pop{position:absolute;left:50%;top:50%;width:76px;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;background:#ffff;color:#111;border:5px solid #111;display:grid;place-items:center;font-size:48px;font-weight:1000;opacity:0;z-index:10}.pop.show{animation:pop .65s}.controls{justify-self:center;display:flex;gap:10px}.small{width:42px;height:42px;border-radius:50%;border:2px solid #fffb;background:#fff2;color:#fff;font-size:20px}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#041008d6;backdrop-filter:blur(6px);z-index:30}.hidden{display:none}.panel,.card{width:min(92vw,470px);border-radius:34px;background:var(--card);color:#111;border:5px solid #fff;box-shadow:0 24px 70px #0007;display:grid;place-items:center;gap:16px;text-align:center;padding:24px 20px}.title{font-size:clamp(2.4rem,10vw,4.3rem);line-height:.86;letter-spacing:-.06em;font-weight:1000}.micro{font-weight:1000;letter-spacing:.04em;font-size:.88rem}.posGrid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pos{border:3px solid #111;border-radius:18px;background:#fff;color:#111;font-weight:1000;padding:12px 6px;display:grid;gap:3px;min-height:64px}.pos span:first-child{font-size:1.25rem}.pos span:last-child{font-size:.72rem}.final{font-size:clamp(3rem,15vw,5.4rem);line-height:.9;font-weight:1000}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.box{border:3px solid #111;border-radius:22px;padding:12px 8px;background:#fff;display:grid;place-items:center;gap:4px;min-height:94px}.big{font-size:2rem;font-weight:1000}.msg{font-weight:950}.smallText{font-size:.82rem;font-weight:850;opacity:.78}.cue-number{min-width:78px;height:78px;border-radius:20px;background:#fff;border:5px solid #111;display:grid;place-items:center;font-size:49px;font-weight:1000}.cue-head{position:relative;width:76px;aspect-ratio:1;border-radius:50%;background:#bd8d6d;border:5px solid #111}.cue-head .hair{transform:translateX(-50%) scale(1.25)}.cue-shirt{position:relative;width:84px;height:74px;border-radius:20px 20px 25px 25px;border:5px solid #111;background:#e8e3d6;overflow:hidden}.cue-band{position:relative;width:96px;height:72px;display:grid;place-items:center}.cue-band:before{content:"";width:46px;height:64px;border-radius:19px 19px 23px 23px;background:#e8e3d6;border:5px solid #111}.mark{position:absolute;top:16px;width:24px;height:44px;border-radius:999px;background:#111;border:4px solid #fff;box-shadow:0 0 0 3px #111}.cue-band.left .mark{left:12px}.cue-band.right .mark{right:12px}.cue-boots{position:relative;width:min(43vw,174px);height:88px}.cue-boots .boot{position:absolute;width:min(22vw,94px);height:44px;bottom:19px;background:#fff;border:6px solid #111;border-radius:999px}.cue-boots .b1{left:0;transform:rotate(-7deg)}.cue-boots .b2{right:0;transform:rotate(7deg)}
@keyframes soft{50%{opacity:1;transform:scale(1.035)}}@keyframes yes{50%{transform:scale(1.1)}}@keyframes no{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}@keyframes pop{20%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(max-width:640px){:root{--ps:clamp(72px,21vw,96px);--ss:clamp(78px,22vw,102px)}.top{grid-template-columns:1fr;justify-items:center}.cue{width:min(96vw,360px);min-height:86px;grid-template-columns:42px 1fr 50px}.cueIcon{width:38px;height:38px}.hint{width:44px;height:44px}.pitch{height:clamp(398px,56svh,540px);min-height:398px}.posGrid{grid-template-columns:repeat(2,1fr)}.pos{min-height:58px;padding:9px 4px}.score{height:30px;min-width:54px;font-size:.86rem}.bootBadge{bottom:-13%;height:31%;border-width:3px}}@media(max-width:380px){:root{--ps:70px;--ss:74px}.pitch{height:392px;min-height:392px}.cue{min-height:82px}.brand{font-size:.8rem}}@media(max-height:700px) and (orientation:landscape){.app{grid-template-rows:auto 1fr auto;grid-template-columns:300px 1fr;align-items:center}.top{grid-column:1/-1}.cue{grid-column:1}.wrap{grid-column:2}.pitch{height:min(76svh,450px);min-height:385px}.controls{grid-column:1/-1}}
</style>
</head>
<body>
<main class="app"><section class="top"><div class="brand"><span>⚽</span><strong>CUE PASS</strong></div><div class="dots" id="dots"></div><div class="score" id="score">0/0</div></section><section class="cue"><div class="cueIcon" id="cueIcon">🔢</div><div class="cueMain" id="cueMain"></div><button class="hint" id="hint">👁️</button></section><section class="wrap"><div class="pitch" id="pitch"><div class="zone" id="z0"></div><div class="zone" id="z1"></div><div class="zone" id="z2"></div><button class="btn" id="p0"></button><button class="btn" id="p1"></button><button class="btn" id="p2"></button><div class="self" id="me"></div><div class="ball" id="ball"></div><div class="pop" id="pop">✓</div></div></section><section class="controls"><button class="small" id="reset">↻</button><button class="small" id="sound">🔈</button></section></main>
<section class="overlay" id="start"><div class="panel"><div class="title">CUE<br>PASS</div><div class="micro">PICK YOUR POSITION</div><div class="posGrid" id="posGrid"></div></div></section>
<section class="overlay hidden" id="finish"><div class="card"><div class="micro" id="resultTitle">SCORE</div><div class="final" id="final">0/10</div><div class="feed"><div class="box"><div>✅</div><div class="big" id="good">0</div><div class="smallText">good choices</div></div><div class="box"><div>👁️</div><div class="big" id="clues">0</div><div class="smallText">clues used</div></div></div><div class="msg" id="msg">Look for cues, not just colours.</div><div class="smallText" id="tip">Use numbers, boots, hair, armbands, patterns and real passing lanes.</div><button class="small" id="again">↻</button></div></section>
<script>
const roles={LB:["Left Back","⬅️",{x:18,y:72},[["LM",18,36],["LCB",39,58],["LCM",47,39]]],RB:["Right Back","➡️",{x:82,y:72},[["RM",82,36],["RCB",61,58],["RCM",53,39]]],LCB:["Left Centre Back","🛡️",{x:39,y:74},[["LB",18,58],["RCB",61,58],["LCM",47,38]]],RCB:["Right Centre Back","🛡️",{x:61,y:74},[["RB",82,58],["LCB",39,58],["RCM",53,38]]],CDM:["Defensive Mid","⚙️",{x:50,y:68},[["LCM",38,41],["RCM",62,41],["CB",50,82]]],LCM:["Left Centre Mid","↖️",{x:40,y:62},[["LW",19,32],["ST",50,25],["CDM",50,78]]],RCM:["Right Centre Mid","↗️",{x:60,y:62},[["RW",81,32],["ST",50,25],["CDM",50,78]]],LM:["Left Midfield","⬅️",{x:18,y:60},[["LB",18,80],["LW",18,30],["LCM",45,50]]],RM:["Right Midfield","➡️",{x:82,y:60},[["RB",82,80],["RW",82,30],["RCM",55,50]]],LW:["Left Wing","⚡",{x:18,y:42},[["ST",50,24],["LM",18,66],["LCM",43,53]]],RW:["Right Wing","⚡",{x:82,y:42},[["ST",50,24],["RM",82,66],["RCM",57,53]]],ST:["Striker","🎯",{x:50,y:38},[["LW",23,34],["RW",77,34],["CAM",50,67]]]};
const rounds=[["number","🔢"],["number","🔢"],["hair","🙂"],["boots","👟"],["armband","💪"],["pattern","👕"],["number","🔢"],["boots","👟"],["hair","🙂"],["pattern","👕"]];
const pool=[{number:7,kit:"kit-light",pattern:"pattern-stripes",hair:"hair-spike",skin:"skin-light",boots:"boots-dots",band:"band-left"},{number:5,kit:"kit-mid",pattern:"pattern-hoops",hair:"hair-mohawk",skin:"skin-deep",boots:"boots-stripes",band:"band-right"},{number:9,kit:"kit-dark",pattern:"pattern-sash",hair:"hair-flat",skin:"",boots:"boots-half",band:"band-left"},{number:3,kit:"kit-light",pattern:"pattern-check",hair:"hair-band",skin:"skin-light",boots:"boots-cross",band:"band-right"},{number:8,kit:"kit-mid",pattern:"pattern-stripes",hair:"hair-flat",skin:"skin-deep",boots:"boots-dots",band:"band-left"},{number:4,kit:"kit-dark",pattern:"pattern-hoops",hair:"hair-spike",skin:"",boots:"boots-half",band:"band-right"}];
let role="LB",ri=0,players=[],target=0,locked=false,sound=true,score=0,clues=0,clueRound=false,wrong=false;
const $=id=>document.getElementById(id), btns=[0,1,2].map(i=>$("p"+i));
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function feat(p,t){return t=="number"?p.number:t=="hair"?p.hair:t=="boots"?p.boots:t=="armband"?p.band:p.pattern}
function choosePlayers(t){let tar=sh(pool)[0],used=new Set([feat(tar,t)]),d=[];for(let p of sh(pool)){if(p===tar)continue;let v=feat(p,t);if(used.has(v))continue;d.push(p);used.add(v);if(d.length==2)break}let ps=sh([tar,...d]);return[ps,ps.indexOf(tar)]}
function player(p){return `<div class="player"><div class="shadow"></div><div class="head ${p.skin}" data-f="hair"><div class="hair ${p.hair}"></div><div class="neck"></div></div><div class="shirt ${p.kit} ${p.pattern}" data-f="pattern"><div class="band ${p.band}" data-f="armband"></div><div class="num" data-f="number">${p.number}</div></div><div class="legs ${p.boots}" data-f="boots"><div class="leg l"><div class="boot"></div></div><div class="leg r"><div class="boot"></div></div></div><div class="bootBadge ${p.boots}" data-f="boots"><div class="bBoot"></div><div class="bBoot"></div></div></div>`}
function dots(){ $("dots").innerHTML=rounds.map((_,i)=>`<div class="dot ${i<ri?'done':''}"></div>`).join("")}
function scenario(){let r=roles[role],s=r[2];$("me").style.setProperty("--sx",s.x+"%");$("me").style.setProperty("--sy",s.y+"%");$("ball").style.setProperty("--bx",s.x+"%");$("ball").style.setProperty("--by",(s.y+9)+"%");r[3].forEach((o,i)=>{let z=$("z"+i);z.textContent=o[0];z.style.setProperty("--x",o[1]+"%");z.style.setProperty("--y",o[2]+"%")})}
function renderPlayers(){let opts=roles[role][3],type=rounds[ri]?.[0];btns.forEach((b,i)=>{b.style.setProperty("--x",opts[i][1]+"%");b.style.setProperty("--y",opts[i][2]+"%");b.className="btn "+(type=="boots"?"bootRound":"");b.innerHTML=player(players[i]);b.setAttribute("aria-label",opts[i][0])})}
function cue(p,r){let t=r[0];$("cueIcon").textContent=r[1];if(t=="number")$("cueMain").innerHTML=`<div class="cue-number">${p.number}</div>`;else if(t=="hair")$("cueMain").innerHTML=`<div class="cue-head ${p.skin}"><div class="hair ${p.hair}"></div></div>`;else if(t=="boots")$("cueMain").innerHTML=`<div class="cue-boots ${p.boots}"><div class="boot b1"></div><div class="boot b2"></div></div>`;else if(t=="armband")$("cueMain").innerHTML=`<div class="cue-band ${p.band=="band-left"?"left":"right"}"><div class="mark"></div></div>`;else $("cueMain").innerHTML=`<div class="cue-shirt ${p.kit} ${p.pattern}"></div>`}
function resetBall(){let s=roles[role][2];let ball=$("ball");ball.style.left=s.x+"%";ball.style.top=(s.y+9)+"%";ball.style.transform="translate(-50%,-50%) scale(1)"}
function clear(){btns.forEach(b=>{b.classList.remove("glow");b.querySelectorAll(".pulse").forEach(e=>e.classList.remove("pulse"))})}
function hint(count=true){if(locked||ri>=rounds.length)return;if(count&&!clueRound){clues++;clueRound=true}clear();let t=rounds[ri][0],b=btns[target];b.classList.add("glow");b.querySelectorAll(`[data-f="${t}"]`).forEach(e=>e.classList.add("pulse"));setTimeout(clear,2400)}
function pop(s){let p=$("pop");p.textContent=s;p.classList.remove("show");void p.offsetWidth;p.classList.add("show")}
function pass(b){let pr=$("pitch").getBoundingClientRect(),br=b.getBoundingClientRect(),ball=$("ball");ball.style.left=(br.left+br.width/2-pr.left)+"px";ball.style.top=(br.top+br.height*.68-pr.top)+"px";ball.style.transform="translate(-50%,-50%) scale(.86)"}
function pick(i){if(locked)return;let b=btns[i];if(i==target){locked=true;if(!clueRound&&!wrong)score++;clear();b.classList.add("ok","glow");pass(b);pop("✓");setTimeout(()=>{ri++;round()},760)}else{wrong=true;b.classList.add("no");pop("✕");setTimeout(()=>{b.classList.remove("no");hint(true)},430)}}
function end(){let name=roles[role][0];$("resultTitle").textContent=name.toUpperCase()+" SCORE";$("final").textContent=`${score}/${rounds.length}`;$("good").textContent=score;$("clues").textContent=clues;$("msg").textContent=score>=9?"Excellent position decisions.":score>=6?"Good progress.":"Keep practising.";$("tip").textContent="Use cues and realistic passing lanes — not colour alone.";$("finish").classList.remove("hidden")}
function round(){locked=false;clear();resetBall();dots();$("score").textContent=`${score}/${ri}`;if(ri>=rounds.length){end();return}clueRound=false;wrong=false;let [ps,ti]=choosePlayers(rounds[ri][0]);players=ps;target=ti;scenario();renderPlayers();cue(players[target],rounds[ri]);if(ri==0)setTimeout(()=>hint(false),400)}
function start(r){role=r;$("start").classList.add("hidden");$("finish").classList.add("hidden");ri=0;score=0;clues=0;round()}
function build(){let g=$("posGrid");Object.entries(roles).forEach(([k,v])=>{let b=document.createElement("button");b.className="pos";b.innerHTML=`<span>${v[1]}</span><span>${v[0]}</span>`;b.onclick=()=>start(k);g.appendChild(b)})}
btns.forEach((b,i)=>b.onclick=()=>pick(i));$("hint").onclick=()=>hint(true);$("reset").onclick=()=>$("start").classList.remove("hidden");$("again").onclick=()=>round();$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔈":"🔇"};
$("me").innerHTML=player({number:12,kit:"kit-light",pattern:"pattern-hoops",hair:"hair-flat",skin:"",boots:"boots-dots",band:"band-left"});build();dots();scenario();players=pool.slice(0,3);renderPlayers();cue(players[0],rounds[0]);
</script>
