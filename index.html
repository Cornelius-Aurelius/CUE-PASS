<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>CUE PASS — Game Day Decisions</title>
<style>
:root{
  --bg:#06130c;--pitch1:#0d3c22;--pitch2:#0a2d19;--line:rgba(255,255,255,.72);
  --card:#f7f7ef;--ink:#111;--player:clamp(54px,9.5vw,86px);--me:clamp(60px,10vw,92px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 0,#1e6b3b88,transparent 42%),linear-gradient(#082414,#06130c);color:#fff;overflow-x:hidden}
body{min-height:100svh;display:grid;place-items:center;padding:8px}
button{font:inherit;cursor:pointer}
.app{width:min(100%,860px);min-height:calc(100svh - 16px);display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;align-content:start}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;width:100%}
.brand{display:flex;align-items:center;gap:8px;font-weight:1000}.brand span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111}.score{min-width:58px;height:34px;border-radius:999px;border:2px solid #fff9;background:#fff2;display:grid;place-items:center;font-weight:1000}.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.dot{width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:#fff3}.dot.done{background:#fff;box-shadow:inset 0 0 0 3px #111}
.cue{justify-self:center;width:min(96vw,390px);min-height:88px;background:var(--card);color:#111;border:4px solid #fff;border-radius:28px;display:grid;grid-template-columns:50px 1fr 52px;align-items:center;gap:8px;padding:8px;box-shadow:0 16px 35px #0005}.cueIcon{width:42px;height:42px;border-radius:15px;background:#111;color:#fff;display:grid;place-items:center;font-size:24px}.cueMain{min-height:70px;display:grid;place-items:center}.hint{width:46px;height:46px;border-radius:17px;border:2.5px solid #111;background:#fff;font-size:23px;position:relative;opacity:.9}.hint:before{content:"?";position:absolute;right:-5px;top:-6px;width:18px;height:18px;border-radius:50%;background:#111;color:#fff;font-size:12px;font-weight:1000;display:grid;place-items:center;border:2px solid #fff}
.pitchWrap{width:100%;display:grid;place-items:center}
.pitch{
  position:relative;width:min(96vw,610px);height:clamp(560px,72svh,820px);border-radius:30px;overflow:hidden;
  background:
    linear-gradient(0deg,transparent 0 49.4%,#ffffff85 49.4% 50.6%,transparent 50.6%),
    repeating-linear-gradient(0deg,var(--pitch1) 0 86px,var(--pitch2) 86px 172px);
  border:4px solid #ffffffd5;box-shadow:inset 0 0 0 4px #ffffff35,0 18px 48px #0006;touch-action:manipulation;
}
.pitch:before{content:"";position:absolute;left:50%;top:50%;width:min(52vw,220px);height:min(52vw,220px);transform:translate(-50%,-50%);border:4px solid var(--line);border-radius:50%;pointer-events:none}
.pitch:after{content:"";position:absolute;inset:4.5% 7%;border:3px solid #ffffff75;border-radius:24px;pointer-events:none}
.goal{position:absolute;left:50%;transform:translateX(-50%);width:42%;height:7%;border:3px solid #ffffff9a;border-radius:0 0 18px 18px;pointer-events:none}.goal.top{top:4.5%;border-radius:0 0 18px 18px}.goal.bottom{bottom:4.5%;border-radius:18px 18px 0 0}
.lane{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(.95rem,3.2vw,1.75rem);color:#ffffff18;z-index:1;pointer-events:none}
.passLine{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}.passLine line{stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 12;opacity:.06}.passLine.active line{opacity:.80;filter:drop-shadow(0 0 6px white)}
.roleBadge{position:absolute;left:var(--x);top:calc(var(--y) - 7.2%);transform:translate(-50%,-50%);z-index:7;background:#ffffffee;color:#111;border:3px solid #111;border-radius:999px;min-width:44px;padding:3px 7px;font-size:clamp(.62rem,1.7vw,.82rem);font-weight:1000;text-align:center;box-shadow:0 6px 12px #0004;pointer-events:none}.selfBadge{position:absolute;left:var(--sx);top:calc(var(--sy) - 7.5%);transform:translate(-50%,-50%);z-index:8;background:#111;color:#fff;border:3px solid #fff;border-radius:999px;min-width:48px;padding:3px 8px;font-size:clamp(.64rem,1.7vw,.84rem);font-weight:1000;box-shadow:0 6px 12px #0005;pointer-events:none}.btn{appearance:none;border:0;background:transparent;padding:0;position:absolute;left:var(--x);top:var(--y);width:var(--player);height:calc(var(--player)*1.42);transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 14px 11px #0007)}.btn.glow{filter:drop-shadow(0 0 16px #fff) drop-shadow(0 14px 11px #0007)}.btn.ok .player{animation:yes .45s}.btn.no .player{animation:no .38s}
.player{position:relative;width:100%;height:100%}.shadow{position:absolute;bottom:0;left:12%;width:76%;height:10%;border-radius:50%;background:#0005;filter:blur(3px)}.head{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:39%;aspect-ratio:1;border-radius:50%;background:#bd8d6d;border:4px solid #111;z-index:5}.skin2{background:#7c513b}.skin3{background:#d4a17d}.hair{position:absolute;left:50%;transform:translateX(-50%);background:#111;z-index:7}.flat{top:-10%;width:92%;height:34%;border-radius:22px 22px 8px 8px}.spike{top:-22%;width:86%;height:42%;background:transparent}.spike:before{content:"";position:absolute;inset:0;background:#111;clip-path:polygon(0 100%,12% 25%,25% 100%,40% 10%,55% 100%,70% 25%,84% 100%,100% 30%,100% 100%)}.bandHair{top:10%;width:95%;height:23%;border-radius:999px}.mohawk{top:-40%;width:34%;height:62%;border-radius:999px 999px 8px 8px}
.shirt{position:absolute;left:50%;top:34%;transform:translateX(-50%);width:70%;height:44%;border-radius:20% 20% 29% 29%;border:4px solid #111;box-shadow:inset 0 0 0 4px #fff4;overflow:hidden;display:grid;place-items:center}.shirt:after{content:"";position:absolute;top:0;left:50%;width:32%;height:14%;transform:translateX(-50%);border-radius:0 0 999px 999px;background:#111}.num{position:relative;z-index:4;color:#fff;font-size:calc(var(--player)*.38);font-weight:1000;-webkit-text-stroke:3px #111;text-shadow:0 4px 0 #111;line-height:.85}.band{position:absolute;top:31%;width:20%;height:44%;border-radius:999px;background:#111;border:3px solid #fff;z-index:6}.left{left:-10%}.right{right:-10%}
.legs{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:56%;height:36%;z-index:2}.leg{position:absolute;top:0;width:34%;height:77%;border-radius:999px;background:#111;border:3px solid #fff}.leg.l{left:8%;transform:rotate(7deg)}.leg.r{right:8%;transform:rotate(-7deg)}.boot{position:absolute;bottom:-30%;width:230%;height:52%;background:#fff;border:5px solid #111;border-radius:999px;overflow:hidden}.leg.l .boot{left:-78%;transform:rotate(-7deg)}.leg.r .boot{right:-78%;transform:rotate(7deg)}
.dotsBoot .boot:after,.stripesBoot .boot:after,.halfBoot .boot:after,.crossBoot .boot:after,.dotsBoot .bBoot:after,.stripesBoot .bBoot:after,.halfBoot .bBoot:after,.crossBoot .bBoot:after{content:"";position:absolute;inset:2px;border-radius:inherit}.dotsBoot .boot:after,.dotsBoot .bBoot:after{background:radial-gradient(circle,#111 0 4px,transparent 4.4px) 0 0/14px 14px}.stripesBoot .boot:after,.stripesBoot .bBoot:after{background:repeating-linear-gradient(90deg,#111 0 8px,transparent 8px 15px)}.halfBoot .boot:after,.halfBoot .bBoot:after{background:linear-gradient(90deg,#111 0 50%,transparent 50%)}.crossBoot .boot:after,.crossBoot .bBoot:after{background:linear-gradient(45deg,transparent 0 35%,#111 35% 65%,transparent 65%),linear-gradient(-45deg,transparent 0 35%,#111 35% 65%,transparent 65%)}
.bootBadge{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);width:94%;height:30%;border-radius:999px;background:#fffe;border:4px solid #111;display:none;grid-template-columns:1fr 1fr;gap:2px;padding:5px;z-index:30}.bBoot{border:3px solid #111;border-radius:999px;background:#fff;position:relative;overflow:hidden}.bootRound .bootBadge{display:grid}.bootRound .num{opacity:.18}.bootRound .shirt{opacity:.75}.bootRound .boot{box-shadow:0 0 0 4px #fff,0 0 18px #fff}
.team-red .shirt{background:#b62222}.team-green .shirt{background:#2b7a30}.team-blue .shirt{background:#2158b8}.team-purple .shirt{background:#6942a8}.team-light .shirt{background:#e9e6d8}.team-dark .shirt{background:#3a3a3a}.team-light .num{color:#111;-webkit-text-stroke:2px #fff;text-shadow:0 2px 0 #fff}
.stripes:before,.hoops:before,.sash:before,.check:before{content:"";position:absolute;inset:0}.stripes:before{background:repeating-linear-gradient(90deg,transparent 0 12px,#0006 12px 20px)}.hoops:before{background:repeating-linear-gradient(0deg,transparent 0 12px,#0006 12px 20px)}.sash:before{background:linear-gradient(135deg,transparent 0 36%,#0007 36% 58%,transparent 58%)}.check:before{background:linear-gradient(45deg,#0006 25%,transparent 25% 75%,#0006 75%),linear-gradient(45deg,#0006 25%,transparent 25% 75%,#0006 75%);background-size:18px 18px;background-position:0 0,9px 9px}
.self{position:absolute;left:var(--sx);top:var(--sy);width:var(--me);height:calc(var(--me)*1.42);transform:translate(-50%,-50%);z-index:6;filter:drop-shadow(0 14px 12px #0008);pointer-events:none}.ball{position:absolute;left:var(--bx);top:var(--by);width:clamp(30px,5vw,40px);aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid #111;z-index:10;transform:translate(-50%,-50%);transition:.42s cubic-bezier(.2,.8,.2,1);display:grid;place-items:center}.ball:after{content:"";width:45%;aspect-ratio:1;background:#111;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.pop{position:absolute;left:50%;top:50%;width:76px;aspect-ratio:1;border-radius:50%;background:#fff;color:#111;border:5px solid #111;display:grid;place-items:center;font-size:48px;font-weight:1000;opacity:0;z-index:30;transform:translate(-50%,-50%) scale(.6)}.pop.show{animation:pop .65s}
.controls{display:flex;gap:10px;justify-content:center}.small{width:42px;height:42px;border-radius:50%;border:2px solid #fffb;background:#fff2;color:#fff;font-size:20px}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#041008dc;backdrop-filter:blur(6px);z-index:50}.hidden{display:none}.panel,.card{width:min(94vw,500px);border-radius:34px;background:#f7f7ef;color:#111;border:5px solid #fff;box-shadow:0 24px 70px #0007;display:grid;place-items:center;gap:14px;text-align:center;padding:22px 18px}.title{font-size:clamp(2.3rem,10vw,4.3rem);line-height:.86;letter-spacing:-.06em;font-weight:1000}.micro{font-weight:1000;letter-spacing:.04em;font-size:.88rem}.posGrid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pos{border:3px solid #111;border-radius:18px;background:#fff;color:#111;font-weight:1000;padding:10px 5px;display:grid;gap:3px;min-height:62px}.pos span:first-child{font-size:1.2rem}.pos span:last-child{font-size:.69rem}.kitGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}.kitBtn{border:3px solid #111;border-radius:18px;background:#fff;color:#111;font-weight:1000;min-height:60px;display:grid;place-items:center}.sw{display:flex;gap:5px}.sw span{width:24px;height:24px;border-radius:7px;border:2px solid #111}.final{font-size:clamp(3rem,15vw,5.4rem);font-weight:1000}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.box{border:3px solid #111;border-radius:22px;padding:12px 8px;background:#fff;display:grid;place-items:center;gap:4px}.big{font-size:2rem;font-weight:1000}.msg{font-weight:950}.smallText{font-size:.82rem;font-weight:850;opacity:.78}
.cue-number{min-width:74px;height:74px;border:5px solid #111;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:48px;font-weight:1000}.cue-head{position:relative;width:74px;aspect-ratio:1;border-radius:50%;background:#bd8d6d;border:5px solid #111}.cue-head .hair{transform:translateX(-50%) scale(1.25)}.cue-shirt{width:82px;height:70px;border:5px solid #111;border-radius:20px 20px 25px 25px;position:relative;overflow:hidden}.cue-band{position:relative;width:92px;height:70px;display:grid;place-items:center}.cue-band:before{content:"";width:45px;height:62px;border-radius:18px 18px 23px 23px;background:#ddd;border:5px solid #111}.mark{position:absolute;top:16px;width:24px;height:42px;background:#111;border:4px solid #fff;border-radius:999px}.cue-band.left .mark{left:12px}.cue-band.right .mark{right:12px}.cue-boots{position:relative;width:min(44vw,172px);height:84px}.cue-boots .boot{position:absolute;width:min(22vw,94px);height:44px;bottom:19px;background:#fff;border:6px solid #111;border-radius:999px}.cue-boots .b1{left:0;transform:rotate(-7deg)}.cue-boots .b2{right:0;transform:rotate(7deg)}
.pulse{animation:pulse 1s infinite!important}.glow .pulse{filter:drop-shadow(0 0 12px #fff)}
@keyframes pulse{50%{transform:scale(1.12);filter:drop-shadow(0 0 12px #fff)}}@keyframes yes{50%{transform:scale(1.1)}}@keyframes no{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}@keyframes pop{20%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(max-width:640px){:root{--player:clamp(52px,15vw,78px);--me:clamp(58px,16vw,84px)}body{padding:6px}.app{gap:7px}.top{grid-template-columns:1fr;justify-items:center}.cue{width:96vw;min-height:84px;grid-template-columns:42px 1fr 50px}.cueIcon{width:38px;height:38px}.hint{width:44px;height:44px}.pitch{height:clamp(520px,69svh,720px);width:96vw}.posGrid,.kitGrid{grid-template-columns:repeat(2,1fr)}.score{height:30px}.brand{font-size:.86rem}.bootBadge{bottom:-14%;height:32%}.roleBadge{top:calc(var(--y) - 6.4%);font-size:.58rem;padding:2px 6px}.selfBadge{top:calc(var(--sy) - 6.8%);font-size:.58rem;padding:2px 6px}}@media(max-width:380px){:root{--player:56px;--me:64px}.pitch{height:515px}.cue{min-height:80px}.brand{font-size:.78rem}.pos{min-height:56px}.kitBtn{min-height:56px}}@media(min-width:900px){.pitch{height:min(72vh,760px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
<section class="top"><div class="brand"><span>⚽</span><strong>CUE PASS</strong></div><div class="dots" id="dots"></div><div class="score" id="score">0/0</div></section>
<section class="cue"><div class="cueIcon" id="cueIcon">🔢</div><div class="cueMain" id="cueMain"></div><button class="hint" id="hint" aria-label="optional clue">👁️</button></section>
<section class="pitchWrap"><div class="pitch" id="pitch"><div class="goal top"></div><div class="goal bottom"></div><svg class="passLine" id="lineSvg"></svg><div class="lane" id="z0"></div><div class="lane" id="z1"></div><div class="lane" id="z2"></div><div class="roleBadge" id="r0"></div><div class="roleBadge" id="r1"></div><div class="roleBadge" id="r2"></div><button class="btn" id="p0"></button><button class="btn" id="p1"></button><button class="btn" id="p2"></button><div class="selfBadge" id="selfRole">LB</div><div class="self" id="me"></div><div class="ball" id="ball"></div><div class="pop" id="pop">✓</div></div></section>
<section class="controls"><button class="small" id="reset">↻</button><button class="small" id="sound">🔈</button></section>
</main>

<section class="overlay" id="start"><div class="panel"><div class="title">CUE<br>PASS</div><div class="micro">PICK YOUR POSITION</div><div class="posGrid" id="posGrid"></div></div></section>
<section class="overlay hidden" id="kits"><div class="panel"><div class="title">KIT<br>CLASH</div><div class="micro">PICK GAME DAY KIT SITUATION</div><div class="kitGrid" id="kitGrid"></div></div></section>
<section class="overlay hidden" id="finish"><div class="card"><div class="micro" id="resultTitle">SCORE</div><div class="final" id="final">0/10</div><div class="feed"><div class="box"><div>✅</div><div class="big" id="good">0</div><div class="smallText">good choices</div></div><div class="box"><div>👁️</div><div class="big" id="clues">0</div><div class="smallText">clues used</div></div></div><div class="msg" id="msg">Read cues, not colour alone.</div><div class="smallText" id="tip">Use position, numbers, boots, hair, armbands, patterns and passing lanes.</div><button class="small" id="again">↻</button></div></section>

<script>
const roles={
LB:["Left Back","⬅️",{x:16,y:83},[["LM",16,43],["LCB",40,77],["LCM",45,56]]],
RB:["Right Back","➡️",{x:84,y:83},[["RM",84,43],["RCB",60,77],["RCM",55,56]]],
LCB:["Left Centre Back","🛡️",{x:36,y:84},[["LB",15,75],["RCB",64,80],["LCM",42,55]]],
RCB:["Right Centre Back","🛡️",{x:64,y:84},[["RB",85,75],["LCB",36,80],["RCM",58,55]]],
CDM:["Defensive Mid","⚙️",{x:50,y:72},[["LCM",34,50],["RCM",66,50],["LCB",36,86]]],
LCM:["Left Centre Mid","↖️",{x:38,y:60},[["LM",15,45],["ST",50,25],["CDM",52,78]]],
RCM:["Right Centre Mid","↗️",{x:62,y:60},[["RM",85,45],["ST",50,25],["CDM",48,78]]],
LM:["Left Midfield","⬅️",{x:15,y:56},[["LB",15,84],["LW",15,25],["LCM",42,55]]],
RM:["Right Midfield","➡️",{x:85,y:56},[["RB",85,84],["RW",85,25],["RCM",58,55]]],
LW:["Left Wing","⚡",{x:15,y:30},[["LM",15,60],["ST",50,20],["LCM",42,48]]],
RW:["Right Wing","⚡",{x:85,y:30},[["RM",85,60],["ST",50,20],["RCM",58,48]]],
ST:["Striker","🎯",{x:50,y:20},[["LW",22,31],["RW",78,31],["CAM",50,48]]]
};
const kitModes={
rg:["Red v Green","🔴","🟢","team-red","team-green"],
bp:["Blue v Purple","🔵","🟣","team-blue","team-purple"],
ld:["Light v Dark","⚪","⚫","team-light","team-dark"]
};
const rounds=[["number","🔢"],["position","📍"],["number","🔢"],["boots","👟"],["hair","🙂"],["armband","💪"],["pattern","👕"],["position","📍"],["boots","👟"],["pattern","👕"]];
const pool=[
{n:7,pat:"stripes",hair:"spike",skin:"skin3",boots:"dotsBoot",band:"left"},
{n:5,pat:"hoops",hair:"mohawk",skin:"skin2",boots:"stripesBoot",band:"right"},
{n:9,pat:"sash",hair:"flat",skin:"",boots:"halfBoot",band:"left"},
{n:3,pat:"check",hair:"bandHair",skin:"skin3",boots:"crossBoot",band:"right"},
{n:8,pat:"stripes",hair:"flat",skin:"skin2",boots:"dotsBoot",band:"left"},
{n:4,pat:"hoops",hair:"spike",skin:"",boots:"halfBoot",band:"right"}
];
let role="LB",kit="rg",ri=0,players=[],target=0,score=0,clues=0,locked=false,clueRound=false,wrong=false;
const $=id=>document.getElementById(id),btns=[0,1,2].map(i=>$("p"+i));
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function f(p,t){return t=="number"?p.n:t=="boots"?p.boots:t=="hair"?p.hair:t=="armband"?p.band:t=="pattern"?p.pat:t}
function choosePlayers(t){let tar=sh(pool)[0],used=new Set([f(tar,t)]),d=[];for(let p of sh(pool)){let v=f(p,t);if(p===tar||used.has(v))continue;d.push(p);used.add(v);if(d.length==2)break}let ps=sh([tar,...d]);return[ps,ps.indexOf(tar)]}
function cls(i){let m=kitModes[kit];return i==target?m[3]:m[4]}
function player(p,team){return `<div class="player ${team}"><div class="shadow"></div><div class="head ${p.skin}" data-f="hair"><div class="hair ${p.hair}"></div></div><div class="shirt ${p.pat}" data-f="pattern"><div class="band ${p.band}" data-f="armband"></div><div class="num" data-f="number">${p.n}</div></div><div class="legs ${p.boots}" data-f="boots"><div class="leg l"><div class="boot"></div></div><div class="leg r"><div class="boot"></div></div></div><div class="bootBadge ${p.boots}" data-f="boots"><div class="bBoot"></div><div class="bBoot"></div></div></div>`}
function dots(){ $("dots").innerHTML=rounds.map((_,i)=>`<div class="dot ${i<ri?'done':''}"></div>`).join("")}
function scenario(){let r=roles[role],s=r[2];$("me").style.setProperty("--sx",s.x+"%");$("me").style.setProperty("--sy",s.y+"%");$("selfRole").textContent=role;$("selfRole").style.setProperty("--sx",s.x+"%");$("selfRole").style.setProperty("--sy",s.y+"%");$("ball").style.setProperty("--bx",s.x+"%");$("ball").style.setProperty("--by",(s.y+8)+"%");r[3].forEach((o,i)=>{let z=$("z"+i);z.textContent="";z.style.setProperty("--x",o[1]+"%");z.style.setProperty("--y",o[2]+"%");let rb=$("r"+i);rb.textContent=o[0];rb.style.setProperty("--x",o[1]+"%");rb.style.setProperty("--y",o[2]+"%")});drawLines()}
function drawLines(){let r=roles[role],s=r[2],svg=$("lineSvg");svg.innerHTML=r[3].map(o=>`<line x1="${s.x}%" y1="${s.y}%" x2="${o[1]}%" y2="${o[2]}%"></line>`).join("")}
function renderPlayers(){let opts=roles[role][3],type=rounds[ri]?.[0];btns.forEach((b,i)=>{b.style.setProperty("--x",opts[i][1]+"%");b.style.setProperty("--y",opts[i][2]+"%");b.className="btn "+(type=="boots"?"bootRound ":"");b.innerHTML=player(players[i],cls(i));b.setAttribute("aria-label",opts[i][0])})}
function cue(p,r){let t=r[0];$("cueIcon").textContent=r[1];if(t=="position"){let opt=roles[role][3][target][0];$("cueMain").innerHTML=`<div class="cue-number" style="font-size:34px">${opt}</div>`}else if(t=="number")$("cueMain").innerHTML=`<div class="cue-number">${p.n}</div>`;else if(t=="hair")$("cueMain").innerHTML=`<div class="cue-head ${p.skin}"><div class="hair ${p.hair}"></div></div>`;else if(t=="boots")$("cueMain").innerHTML=`<div class="cue-boots ${p.boots}"><div class="boot b1"></div><div class="boot b2"></div></div>`;else if(t=="armband")$("cueMain").innerHTML=`<div class="cue-band ${p.band}"><div class="mark"></div></div>`;else $("cueMain").innerHTML=`<div class="cue-shirt ${cls(target)} ${p.pat}"></div>`}
function resetBall(){let s=roles[role][2],b=$("ball");b.style.left=s.x+"%";b.style.top=(s.y+8)+"%";b.style.transform="translate(-50%,-50%) scale(1)"}
function clear(){btns.forEach(b=>{b.classList.remove("glow");b.querySelectorAll(".pulse").forEach(e=>e.classList.remove("pulse"))});$("lineSvg").classList.remove("active")}
function hint(count=true){if(locked||ri>=rounds.length)return;if(count&&!clueRound){clues++;clueRound=true}clear();let t=rounds[ri][0],b=btns[target];b.classList.add("glow");$("lineSvg").classList.add("active");if(t=="position")return setTimeout(clear,2400);b.querySelectorAll(`[data-f="${t}"]`).forEach(e=>e.classList.add("pulse"));setTimeout(clear,2400)}
function pop(s){let p=$("pop");p.textContent=s;p.classList.remove("show");void p.offsetWidth;p.classList.add("show")}
function pass(b){let pr=$("pitch").getBoundingClientRect(),br=b.getBoundingClientRect(),ball=$("ball");ball.style.left=(br.left+br.width/2-pr.left)+"px";ball.style.top=(br.top+br.height*.68-pr.top)+"px";ball.style.transform="translate(-50%,-50%) scale(.86)"}
function pick(i){if(locked)return;let b=btns[i];if(i==target){locked=true;if(!clueRound&&!wrong)score++;clear();b.classList.add("ok","glow");pass(b);pop("✓");setTimeout(()=>{ri++;round()},760)}else{wrong=true;b.classList.add("no");pop("✕");setTimeout(()=>{b.classList.remove("no");hint(true)},430)}}
function end(){let name=roles[role][0];$("resultTitle").textContent=name.toUpperCase()+" SCORE";$("final").textContent=`${score}/${rounds.length}`;$("good").textContent=score;$("clues").textContent=clues;$("msg").textContent=score>=9?"Excellent game-day decisions.":score>=6?"Good progress.":"Keep practising."; $("tip").textContent="Read the real passing lane, then use cues — number, boots, hair, armband and pattern. Do not rely on colour alone.";$("finish").classList.remove("hidden")}
function round(){locked=false;clear();resetBall();dots();$("score").textContent=`${score}/${ri}`;if(ri>=rounds.length){end();return}clueRound=false;wrong=false;let type=rounds[ri][0],sel=choosePlayers(type);players=sel[0];target=sel[1];scenario();renderPlayers();cue(players[target],rounds[ri]);if(ri==0)setTimeout(()=>hint(false),400)}
function startPosition(r){role=r;$("start").classList.add("hidden");$("kits").classList.remove("hidden")}
function startKit(k){kit=k;$("kits").classList.add("hidden");$("finish").classList.add("hidden");ri=0;score=0;clues=0;round()}
function build(){let pg=$("posGrid");Object.entries(roles).forEach(([k,v])=>{let b=document.createElement("button");b.className="pos";b.innerHTML=`<span>${v[1]}</span><span>${v[0]}</span>`;b.onclick=()=>startPosition(k);pg.appendChild(b)});let kg=$("kitGrid");Object.entries(kitModes).forEach(([k,v])=>{let b=document.createElement("button");b.className="kitBtn";b.innerHTML=`<div class="sw"><span style="background:${v[3]=='team-red'?'#b62222':v[3]=='team-blue'?'#2158b8':'#e9e6d8'}"></span><span style="background:${v[4]=='team-green'?'#2b7a30':v[4]=='team-purple'?'#6942a8':'#3a3a3a'}"></span></div><div>${v[0]}</div>`;b.onclick=()=>startKit(k);kg.appendChild(b)})}
btns.forEach((b,i)=>b.onclick=()=>pick(i));$("hint").onclick=()=>hint(true);$("reset").onclick=()=>{$("start").classList.remove("hidden")};$("again").onclick=()=>startKit(kit);$("sound").onclick=()=>{};
$("me").innerHTML=player({n:12,pat:"hoops",hair:"flat",skin:"",boots:"dotsBoot",band:"left"},"team-light");
build();dots();scenario();players=pool.slice(0,3);target=0;renderPlayers();cue(players[0],rounds[0]);
</script>
</body>
</html>
