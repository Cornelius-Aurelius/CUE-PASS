<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CUE PASS — Colour Blind Football Game</title>

  <style>
    :root {
      --bg: #06130c;
      --pitch-a: #103820;
      --pitch-b: #0b2a19;
      --line: rgba(255,255,255,.74);
      --card: rgba(250,250,244,.97);
      --ink: #101414;
      --shadow: rgba(0,0,0,.36);
      --player-size: clamp(92px, 11.2vw, 132px);
      --self-size: clamp(88px, 10.5vw, 122px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 6%, rgba(47, 124, 70, .55), transparent 43%),
        linear-gradient(180deg, #092315, var(--bg));
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      width: min(100%, 960px);
      min-height: calc(100svh - 20px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      align-content: start;
    }

    .top {
      width: min(100%, 740px);
      justify-self: center;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 42px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 1000;
      letter-spacing: .03em;
      font-size: clamp(.82rem, 2vw, .98rem);
      white-space: nowrap;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
    }

    .brand-ball {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      color: #111;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 15px rgba(0,0,0,.26);
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.85);
      background: rgba(255,255,255,.18);
    }

    .dot.done {
      background: #fff;
      box-shadow: inset 0 0 0 3px #101414;
    }

    .score-pill {
      min-width: 58px;
      height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.58);
      background: rgba(255,255,255,.14);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: .95rem;
      box-shadow: 0 8px 18px rgba(0,0,0,.22);
    }

    .top-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.42);
      background: rgba(255,255,255,.12);
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .cue-zone {
      justify-self: center;
      width: min(100%, 740px);
      display: grid;
      place-items: center;
      position: relative;
      z-index: 5;
    }

    .cue-card {
      width: min(94vw, 380px);
      min-height: 98px;
      border-radius: 27px;
      background: var(--card);
      color: var(--ink);
      display: grid;
      grid-template-columns: 54px 1fr 58px;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 4px solid #fff;
      box-shadow: 0 16px 35px rgba(0,0,0,.26);
    }

    .cue-type {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 26px;
      border: 0;
      background: #111;
      color: #fff;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
    }

    .hint-btn {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 18px;
      border: 2.5px solid #101414;
      background: rgba(255,255,255,.92);
      color: #101414;
      display: grid;
      place-items: center;
      font-size: 24px;
      box-shadow:
        0 6px 14px rgba(0,0,0,.18),
        inset 0 0 0 2px rgba(255,255,255,.6);
      opacity: .86;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
      animation: hintSoftPulse 2.8s ease-in-out infinite;
    }

    .hint-btn::before {
      content: "?";
      position: absolute;
      right: -5px;
      top: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #101414;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: 12px;
      border: 2px solid #fff;
    }

    .hint-btn::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 22px;
      border: 2px solid rgba(255,255,255,.42);
      opacity: .5;
      pointer-events: none;
    }

    .hint-btn:hover,
    .hint-btn:focus-visible {
      opacity: 1;
      box-shadow:
        0 8px 18px rgba(0,0,0,.24),
        0 0 0 4px rgba(255,255,255,.28);
    }

    .hint-btn:active {
      transform: scale(.94);
      opacity: 1;
    }

    .cue-main {
      min-height: 78px;
      display: grid;
      place-items: center;
    }

    .field-wrap {
      justify-self: center;
      width: min(100%, 740px);
      display: grid;
      place-items: center;
    }

    .pitch {
      position: relative;
      width: 100%;
      height: clamp(390px, 56svh, 515px);
      min-height: 390px;
      border-radius: 28px;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent 0 49.2%, rgba(255,255,255,.54) 49.2% 50.8%, transparent 50.8% 100%),
        repeating-linear-gradient(90deg, var(--pitch-a) 0 88px, var(--pitch-b) 88px 176px);
      box-shadow:
        inset 0 0 0 4px rgba(255,255,255,.70),
        0 18px 48px rgba(0,0,0,.33);
      border: 2px solid rgba(255,255,255,.24);
      touch-action: manipulation;
      isolation: isolate;
    }

    .pitch::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(33vw, 190px);
      height: min(33vw, 190px);
      transform: translate(-50%, -50%);
      border: 4px solid var(--line);
      border-radius: 50%;
      opacity: .72;
      pointer-events: none;
    }

    .pitch::after {
      content: "";
      position: absolute;
      inset: 7% 6%;
      border: 2.5px solid rgba(255,255,255,.44);
      border-radius: 18px;
      pointer-events: none;
    }

    .player-btn {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--player-size);
      height: calc(var(--player-size) * 1.35);
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      z-index: 4;
      filter: drop-shadow(0 14px 11px rgba(0,0,0,.36));
    }

    .player-btn:focus-visible,
    .small-btn:focus-visible,
    .hint-btn:focus-visible,
    .play-btn:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 4px;
    }

    .player-btn.target-glow {
      filter:
        drop-shadow(0 0 16px rgba(255,255,255,.96))
        drop-shadow(0 14px 11px rgba(0,0,0,.34));
    }

    .player-btn.correct .player {
      animation: yesPulse .48s ease both;
    }

    .player-btn.wrong .player {
      animation: noShake .38s ease both;
    }

    .player {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .shadow {
      position: absolute;
      bottom: 0;
      width: 74%;
      height: 11%;
      border-radius: 50%;
      background: rgba(0,0,0,.32);
      filter: blur(3px);
    }

    /* Players are shown from behind, so shirt numbers sit on the back. */
    .head {
      position: absolute;
      left: 50%;
      top: 3%;
      transform: translateX(-50%);
      width: 39%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #bd8d6d;
      border: 4px solid #101414;
      z-index: 5;
    }

    .skin-light { background: #d2a37f; }
    .skin-deep { background: #7e5039; }

    .neck {
      position: absolute;
      left: 50%;
      bottom: -11%;
      width: 28%;
      height: 19%;
      transform: translateX(-50%);
      background: inherit;
      border-left: 3px solid #101414;
      border-right: 3px solid #101414;
      z-index: -1;
    }

    .hair {
      position: absolute;
      left: 50%;
      top: -16%;
      transform: translateX(-50%);
      background: #101414;
      z-index: 7;
    }

    .hair-flat {
      width: 92%;
      height: 35%;
      border-radius: 24px 24px 9px 9px;
      top: -10%;
    }

    .hair-spike {
      width: 86%;
      height: 43%;
      background: transparent;
      top: -23%;
    }

    .hair-spike::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #101414;
      clip-path: polygon(0% 100%, 10% 26%, 23% 100%, 38% 14%, 52% 100%, 68% 24%, 82% 100%, 100% 30%, 100% 100%);
    }

    .hair-band {
      width: 95%;
      height: 24%;
      border-radius: 999px;
      top: 10%;
    }

    .hair-mohawk {
      width: 34%;
      height: 64%;
      border-radius: 999px 999px 8px 8px;
      top: -42%;
    }

    .shirt {
      position: absolute;
      left: 50%;
      top: 34%;
      transform: translateX(-50%);
      width: 68%;
      height: 45%;
      border-radius: 21% 21% 29% 29%;
      background: #e6e6e6;
      border: 4px solid #101414;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.24);
      overflow: hidden;
      display: grid;
      place-items: center;
      z-index: 3;
    }

    .shirt::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 32%;
      height: 14%;
      transform: translateX(-50%);
      border-radius: 0 0 999px 999px;
      background: #101414;
      z-index: 2;
      opacity: .9;
    }

    .kit-light { background: #e8e3d6; }
    .kit-mid { background: #bfcbd0; }
    .kit-dark { background: #9f9f9f; }

    .pattern-stripes::before,
    .pattern-hoops::before,
    .pattern-sash::before,
    .pattern-check::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .96;
    }

    .pattern-stripes::before {
      background: repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,.42) 11px 19px);
    }

    .pattern-hoops::before {
      background: repeating-linear-gradient(0deg, transparent 0 12px, rgba(0,0,0,.42) 12px 20px);
    }

    .pattern-sash::before {
      background: linear-gradient(135deg, transparent 0 36%, rgba(0,0,0,.48) 36% 58%, transparent 58% 100%);
    }

    .pattern-check::before {
      background:
        linear-gradient(45deg, rgba(0,0,0,.44) 25%, transparent 25% 75%, rgba(0,0,0,.44) 75%),
        linear-gradient(45deg, rgba(0,0,0,.44) 25%, transparent 25% 75%, rgba(0,0,0,.44) 75%);
      background-size: 18px 18px;
      background-position: 0 0, 9px 9px;
    }

    .back-number {
      position: relative;
      z-index: 4;
      color: #fff;
      font-weight: 1000;
      font-size: calc(var(--player-size) * .34);
      line-height: .82;
      letter-spacing: -.05em;
      -webkit-text-stroke: 3px #101414;
      text-shadow:
        0 4px 0 #101414,
        0 0 8px rgba(255,255,255,.45);
    }

    .band {
      position: absolute;
      top: 31%;
      width: 19%;
      height: 44%;
      border-radius: 999px;
      background: #101414;
      border: 3px solid #fff;
      z-index: 5;
    }

    .band-left { left: -9%; }
    .band-right { right: -9%; }

    .legs {
      position: absolute;
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      width: 55%;
      height: 36%;
      z-index: 2;
    }

    .leg {
      position: absolute;
      top: 0;
      width: 34%;
      height: 77%;
      border-radius: 999px;
      background: #101414;
      border: 3px solid rgba(255,255,255,.94);
    }

    .leg.l { left: 8%; transform: rotate(7deg); }
    .leg.r { right: 8%; transform: rotate(-7deg); }

    .boot {
      position: absolute;
      bottom: -29%;
      width: 230%;
      height: 50%;
      background: #fff;
      border: 5px solid #101414;
      border-radius: 999px;
      overflow: hidden;
    }

    .leg.l .boot { left: -78%; transform: rotate(-7deg); }
    .leg.r .boot { right: -78%; transform: rotate(7deg); }

    .boots-dots .boot::after,
    .boots-stripes .boot::after,
    .boots-half .boot::after,
    .boots-cross .boot::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
    }

    .boots-dots .boot::after {
      background: radial-gradient(circle, #101414 0 4px, transparent 4.4px) 0 0/14px 14px;
    }

    .boots-stripes .boot::after {
      background: repeating-linear-gradient(90deg, #101414 0 8px, transparent 8px 15px);
    }

    .boots-half .boot::after {
      background: linear-gradient(90deg, #101414 0 50%, transparent 50% 100%);
    }

    .boots-cross .boot::after {
      background:
        linear-gradient(45deg, transparent 0 36%, #101414 36% 64%, transparent 64%),
        linear-gradient(-45deg, transparent 0 36%, #101414 36% 64%, transparent 64%);
    }

    .feature-pulse {
      animation: featurePulse 1.05s ease-in-out infinite;
      z-index: 20 !important;
    }

    .boot-badge {
      position: absolute;
      left: 50%;
      bottom: -10%;
      transform: translateX(-50%);
      width: 94%;
      height: 29%;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      border: 4px solid #101414;
      display: none;
      place-items: center;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      padding: 5px;
      z-index: 25;
      box-shadow: 0 8px 18px rgba(0,0,0,.28);
    }

    .badge-boot {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: #fff;
      border: 3px solid #101414;
      position: relative;
      overflow: hidden;
    }

    .badge-boot.one { transform: rotate(-6deg); }
    .badge-boot.two { transform: rotate(6deg); }

    .boots-dots .badge-boot::after,
    .boots-stripes .badge-boot::after,
    .boots-half .badge-boot::after,
    .boots-cross .badge-boot::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
    }

    .boots-dots .badge-boot::after {
      background: radial-gradient(circle, #101414 0 4px, transparent 4.4px) 0 0/13px 13px;
    }

    .boots-stripes .badge-boot::after {
      background: repeating-linear-gradient(90deg, #101414 0 8px, transparent 8px 15px);
    }

    .boots-half .badge-boot::after {
      background: linear-gradient(90deg, #101414 0 50%, transparent 50% 100%);
    }

    .boots-cross .badge-boot::after {
      background:
        linear-gradient(45deg, transparent 0 35%, #101414 35% 65%, transparent 65%),
        linear-gradient(-45deg, transparent 0 35%, #101414 35% 65%, transparent 65%);
    }

    .boot-round .boot-badge {
      display: grid;
    }

    .boot-round .back-number {
      opacity: .22;
    }

    .boot-round .shirt {
      opacity: .78;
    }

    .boot-round .legs .boot {
      box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 0 18px rgba(255,255,255,.9);
    }

    .feature-pulse.boot,
    .feature-pulse .boot {
      box-shadow:
        0 0 0 5px #fff,
        0 0 22px 9px rgba(255,255,255,.92);
    }

    .self {
      position: absolute;
      left: 50%;
      top: 84%;
      width: var(--self-size);
      height: calc(var(--self-size) * 1.35);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 12px 9px rgba(0,0,0,.34));
    }

    .self .shirt {
      background: #fff;
    }

    .self .back-number {
      font-size: calc(var(--self-size) * .31);
    }

    .ball {
      position: absolute;
      left: 50%;
      top: 93%;
      width: clamp(30px, 4.3vw, 38px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fff;
      border: 4px solid #101414;
      z-index: 8;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 14px rgba(0,0,0,.28);
      transition:
        left .42s cubic-bezier(.2,.8,.2,1),
        top .42s cubic-bezier(.2,.8,.2,1),
        transform .42s cubic-bezier(.2,.8,.2,1);
    }

    .ball::after {
      content: "";
      width: 45%;
      aspect-ratio: 1;
      background: #101414;
      clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%);
    }

    .pop {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76px;
      aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(.6);
      border-radius: 50%;
      background: rgba(255,255,255,.96);
      color: #101414;
      border: 5px solid #101414;
      display: grid;
      place-items: center;
      font-size: 48px;
      font-weight: 1000;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 15px 34px rgba(0,0,0,.34);
    }

    .pop.show {
      animation: pop .65s ease both;
    }

    .controls {
      justify-self: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 46px;
    }

    .small-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255,255,255,.7);
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 20px;
      box-shadow: 0 8px 18px rgba(0,0,0,.26);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(4,12,8,.84);
      backdrop-filter: blur(6px);
      z-index: 30;
    }

    .overlay.hidden {
      display: none;
    }

    .score-card {
      width: min(92vw, 430px);
      border-radius: 32px;
      background: var(--card);
      color: var(--ink);
      border: 5px solid #fff;
      box-shadow: 0 24px 70px rgba(0,0,0,.42);
      display: grid;
      gap: 14px;
      padding: 22px;
      text-align: center;
    }

    .final-score {
      font-size: clamp(3rem, 15vw, 5.4rem);
      line-height: .9;
      font-weight: 1000;
      letter-spacing: -.06em;
    }

    .feedback-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .feedback-box {
      border: 3px solid #101414;
      border-radius: 22px;
      padding: 12px 8px;
      background: #fff;
      display: grid;
      place-items: center;
      gap: 4px;
      min-height: 94px;
    }

    .feedback-icon {
      font-size: 2rem;
    }

    .feedback-num {
      font-size: 2rem;
      font-weight: 1000;
      line-height: 1;
    }

    .feedback-message {
      font-size: 1rem;
      font-weight: 950;
      line-height: 1.15;
    }

    .feedback-small {
      font-size: .82rem;
      font-weight: 850;
      opacity: .78;
      line-height: 1.15;
    }

    .panel {
      width: min(92vw, 430px);
      border-radius: 34px;
      background: var(--card);
      color: var(--ink);
      border: 5px solid #fff;
      box-shadow: 0 24px 70px rgba(0,0,0,.42);
      display: grid;
      place-items: center;
      gap: 16px;
      text-align: center;
      padding: 24px 20px;
    }

    .title {
      font-size: clamp(2.4rem, 10vw, 4.3rem);
      line-height: .86;
      letter-spacing: -.06em;
      font-weight: 1000;
    }

    .icon-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: clamp(2rem, 8vw, 3.4rem);
    }

    .micro {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 1000;
      letter-spacing: .04em;
      font-size: .88rem;
      color: #101414;
      opacity: .94;
    }

    .play-btn {
      min-width: 90px;
      height: 70px;
      border: 0;
      border-radius: 999px;
      background: #101414;
      color: #fff;
      font-size: 34px;
      display: grid;
      place-items: center;
      box-shadow: 0 14px 26px rgba(0,0,0,.28);
    }

    .cue-number {
      min-width: 78px;
      height: 78px;
      border-radius: 20px;
      background: #fff;
      color: #101414;
      border: 5px solid #101414;
      display: grid;
      place-items: center;
      font-size: 49px;
      font-weight: 1000;
      line-height: .9;
      box-shadow: 0 0 0 4px rgba(0,0,0,.06);
    }

    .cue-head {
      position: relative;
      width: 76px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #bd8d6d;
      border: 5px solid #101414;
    }

    .cue-head .neck {
      display: none;
    }

    .cue-head .hair {
      transform: translateX(-50%) scale(1.25);
    }

    .cue-shirt {
      position: relative;
      width: 84px;
      height: 74px;
      border-radius: 20px 20px 25px 25px;
      border: 5px solid #101414;
      background: #e8e3d6;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .cue-shirt .back-number {
      font-size: 0;
    }

    .cue-band {
      position: relative;
      width: 96px;
      height: 72px;
      display: grid;
      place-items: center;
    }

    .cue-band::before {
      content: "";
      width: 46px;
      height: 64px;
      border-radius: 19px 19px 23px 23px;
      background: #e8e3d6;
      border: 5px solid #101414;
    }

    .cue-band .band-mark {
      position: absolute;
      top: 16px;
      width: 24px;
      height: 44px;
      border-radius: 999px;
      background: #101414;
      border: 4px solid #fff;
      box-shadow: 0 0 0 3px #101414;
    }

    .cue-band.left .band-mark { left: 12px; }
    .cue-band.right .band-mark { right: 12px; }

    .cue-boots {
      position: relative;
      width: min(43vw, 174px);
      height: 88px;
      display: grid;
      place-items: center;
    }

    .cue-boots .boot {
      position: absolute;
      width: min(22vw, 94px);
      height: 44px;
      bottom: 19px;
      background: #fff;
      border: 6px solid #101414;
      border-radius: 999px;
      overflow: hidden;
    }

    .cue-boots .boot.b1 { left: 0; transform: rotate(-7deg); }
    .cue-boots .boot.b2 { right: 0; transform: rotate(7deg); }

    .cue-boots.boots-dots .boot::after,
    .cue-boots.boots-stripes .boot::after,
    .cue-boots.boots-half .boot::after,
    .cue-boots.boots-cross .boot::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
    }

    .cue-boots.boots-dots .boot::after {
      background: radial-gradient(circle, #101414 0 5px, transparent 5.4px) 0 0/15px 15px;
    }

    .cue-boots.boots-stripes .boot::after {
      background: repeating-linear-gradient(90deg, #101414 0 9px, transparent 9px 17px);
    }

    .cue-boots.boots-half .boot::after {
      background: linear-gradient(90deg, #101414 0 50%, transparent 50% 100%);
    }

    .cue-boots.boots-cross .boot::after {
      background:
        linear-gradient(45deg, transparent 0 36%, #101414 36% 64%, transparent 64%),
        linear-gradient(-45deg, transparent 0 36%, #101414 36% 64%, transparent 64%);
    }

    @keyframes hintSoftPulse {
      0%, 100% {
        opacity: .82;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.035);
      }
    }

    @keyframes featurePulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 0 rgba(255,255,255,0));
      }
      50% {
        transform: scale(1.13);
        filter: drop-shadow(0 0 12px rgba(255,255,255,1));
      }
    }

    @keyframes yesPulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes noShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-6px); }
    }

    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.45); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(.75); }
    }

    @media (max-width: 640px) {
      :root {
        --player-size: clamp(82px, 23vw, 104px);
        --self-size: clamp(80px, 22vw, 102px);
      }

      body {
        padding: 8px;
      }

      .app {
        min-height: calc(100svh - 16px);
        gap: 8px;
      }

      .top {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 6px;
      }

      .score-pill {
        height: 32px;
        min-width: 56px;
        font-size: .9rem;
      }

      .brand {
        font-size: .86rem;
      }

      .cue-card {
        width: min(96vw, 350px);
        min-height: 92px;
        grid-template-columns: 46px 1fr 56px;
        border-radius: 24px;
      }

      .cue-type {
        width: 40px;
        height: 40px;
        border-radius: 15px;
        font-size: 23px;
      }

      .hint-btn {
        width: 48px;
        height: 48px;
        border-radius: 18px;
        font-size: 24px;
      }

      .cue-main {
        min-height: 70px;
      }

      .pitch {
        height: clamp(410px, 58svh, 540px);
        min-height: 410px;
        border-radius: 24px;
      }

      .boot-badge {
        bottom: -13%;
        height: 31%;
        border-width: 3px;
      }

      .pitch::before {
        width: 148px;
        height: 148px;
      }

      .dot {
        width: 10px;
        height: 10px;
      }

      .controls {
        min-height: 42px;
      }

      .small-btn {
        width: 40px;
        height: 40px;
      }
    }


    @media (max-width: 380px) {
      :root {
        --player-size: 78px;
        --self-size: 78px;
      }

      .cue-card {
        width: 96vw;
        min-height: 84px;
        grid-template-columns: 42px 1fr 50px;
        padding: 7px;
      }

      .hint-btn {
        width: 44px;
        height: 44px;
        font-size: 22px;
      }

      .cue-type {
        width: 38px;
        height: 38px;
        font-size: 21px;
      }

      .pitch {
        height: 404px;
        min-height: 404px;
      }

      .brand {
        font-size: .78rem;
      }

      .score-pill {
        height: 29px;
        min-width: 52px;
      }
    }

    @media (max-height: 700px) and (orientation: landscape) {
      .app {
        min-height: auto;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 300px 1fr;
        width: min(100%, 990px);
        align-items: center;
      }

      .top {
        grid-column: 1 / -1;
        width: 100%;
      }

      .cue-zone {
        grid-column: 1;
        align-self: center;
      }

      .field-wrap {
        grid-column: 2;
      }

      .pitch {
        height: min(76svh, 450px);
        min-height: 395px;
      }

      .controls {
        grid-column: 1 / -1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="app" aria-label="Cue Pass colour blind football decision game">
    <section class="top" aria-label="game header">
      <div class="brand"><span class="brand-ball">⚽</span><strong>CUE PASS</strong></div>
      <div class="dots" id="dots" aria-label="round progress"></div>
      <div class="score-pill" id="scorePill" aria-label="score">0/0</div>
    </section>

    <section class="cue-zone" aria-label="current visual cue">
      <div class="cue-card">
        <div class="cue-type" id="cueIcon" aria-hidden="true">🔢</div>
        <div class="cue-main" id="cueMain"></div>
        <button class="hint-btn" id="hintBtn" aria-label="optional visual clue">👁️</button>
      </div>
    </section>

    <section class="field-wrap">
      <div class="pitch" id="pitch" aria-label="football pitch">
        <button class="player-btn" id="p0" aria-label="player one"></button>
        <button class="player-btn" id="p1" aria-label="player two"></button>
        <button class="player-btn" id="p2" aria-label="player three"></button>

        <div class="self" id="selfPlayer" aria-hidden="true"></div>
        <div class="ball" id="ball" aria-hidden="true"></div>
        <div class="pop" id="pop" aria-hidden="true">✓</div>
      </div>
    </section>

    <section class="controls" aria-label="game controls">
      <button class="small-btn" id="resetBtn" aria-label="restart">↻</button>
      <button class="small-btn" id="soundBtn" aria-label="sound on or off">🔈</button>
    </section>
  </main>

  <section class="overlay" id="startOverlay">
    <div class="panel">
      <div class="title">CUE<br>PASS</div>
      <div class="icon-flow" aria-hidden="true">👀 ➜ 🎯 ➜ ⚽</div>
      <div class="micro">LESS COLOUR · MORE CUES</div>
      <button class="play-btn" id="playBtn" aria-label="start">▶</button>
    </div>
  </section>

  <section class="overlay hidden" id="finishOverlay">
    <div class="score-card">
      <div class="micro">CUE PASS SCORE</div>
      <div class="final-score" id="finalScore">0/10</div>

      <div class="feedback-grid">
        <div class="feedback-box">
          <div class="feedback-icon">✅</div>
          <div class="feedback-num" id="goodCount">0</div>
          <div class="feedback-small">good choices</div>
        </div>
        <div class="feedback-box">
          <div class="feedback-icon">👁️</div>
          <div class="feedback-num" id="clueCount">0</div>
          <div class="feedback-small">clues used</div>
        </div>
      </div>

      <div class="feedback-message" id="finalMessage">Look for cues, not just colours.</div>
      <div class="feedback-small" id="finalTip">Numbers, boots, hair, armbands and patterns can help you decide faster.</div>

      <button class="play-btn" id="againBtn" aria-label="play again">↻</button>
    </div>
  </section>

  <script>
    const rounds = [
      { type: "number", icon: "🔢" },
      { type: "number", icon: "🔢" },
      { type: "number", icon: "🔢" },
      { type: "hair", icon: "🙂" },
      { type: "boots", icon: "👟" },
      { type: "armband", icon: "💪" },
      { type: "pattern", icon: "👕" },
      { type: "hair", icon: "🙂" },
      { type: "boots", icon: "👟" },
      { type: "pattern", icon: "👕" }
    ];

    const playersPool = [
      { number: 7, kit: "kit-light", pattern: "pattern-stripes", hair: "hair-spike", skin: "skin-light", boots: "boots-dots", band: "band-left" },
      { number: 5, kit: "kit-mid", pattern: "pattern-hoops", hair: "hair-mohawk", skin: "skin-deep", boots: "boots-stripes", band: "band-right" },
      { number: 9, kit: "kit-dark", pattern: "pattern-sash", hair: "hair-flat", skin: "", boots: "boots-half", band: "band-left" },
      { number: 3, kit: "kit-light", pattern: "pattern-check", hair: "hair-band", skin: "skin-light", boots: "boots-cross", band: "band-right" },
      { number: 8, kit: "kit-mid", pattern: "pattern-stripes", hair: "hair-flat", skin: "skin-deep", boots: "boots-dots", band: "band-left" },
      { number: 4, kit: "kit-dark", pattern: "pattern-hoops", hair: "hair-spike", skin: "", boots: "boots-half", band: "band-right" }
    ];

    const positions = [
      { x: 24, y: 35 },
      { x: 76, y: 35 },
      { x: 50, y: 59 }
    ];

    let roundIndex = 0;
    let currentPlayers = [];
    let targetIndex = 0;
    let locked = false;
    let soundOn = true;
    let score = 0;
    let mistakes = 0;
    let cluesUsed = 0;
    let clueUsedThisRound = false;
    let wrongThisRound = false;

    const dots = document.getElementById("dots");
    const cueIcon = document.getElementById("cueIcon");
    const cueMain = document.getElementById("cueMain");
    const hintBtn = document.getElementById("hintBtn");
    const pitch = document.getElementById("pitch");
    const ball = document.getElementById("ball");
    const pop = document.getElementById("pop");
    const resetBtn = document.getElementById("resetBtn");
    const soundBtn = document.getElementById("soundBtn");
    const playBtn = document.getElementById("playBtn");
    const againBtn = document.getElementById("againBtn");
    const startOverlay = document.getElementById("startOverlay");
    const finishOverlay = document.getElementById("finishOverlay");
    const buttons = [0,1,2].map(i => document.getElementById(`p${i}`));
    const selfPlayer = document.getElementById("selfPlayer");
    const scorePill = document.getElementById("scorePill");
    const finalScore = document.getElementById("finalScore");
    const goodCount = document.getElementById("goodCount");
    const clueCount = document.getElementById("clueCount");
    const finalMessage = document.getElementById("finalMessage");
    const finalTip = document.getElementById("finalTip");

    function shuffle(items) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getFeatureValue(player, type) {
      if (type === "number") return String(player.number);
      if (type === "hair") return player.hair;
      if (type === "boots") return player.boots;
      if (type === "armband") return player.band;
      if (type === "pattern") return player.pattern;
      return "";
    }

    /* Accuracy upgrade:
       For every round, the target cue is unique.
       Example: on a boots round, only ONE player has the matching boots.
       This prevents unclear / unfair matching. */
    function choosePlayersForRound(type) {
      const target = shuffle(playersPool)[0];
      const usedValues = new Set([getFeatureValue(target, type)]);
      const distractors = [];

      for (const player of shuffle(playersPool)) {
        if (player === target) continue;
        const value = getFeatureValue(player, type);
        if (usedValues.has(value)) continue;

        distractors.push(player);
        usedValues.add(value);

        if (distractors.length === 2) break;
      }

      const chosen = shuffle([target, ...distractors]);
      return {
        players: chosen,
        targetIndex: chosen.indexOf(target)
      };
    }

    function playerHTML(p) {
      return `
        <div class="player">
          <div class="shadow"></div>
          <div class="head ${p.skin}" data-feature="hair">
            <div class="hair ${p.hair}"></div>
            <div class="neck"></div>
          </div>
          <div class="shirt ${p.kit} ${p.pattern}" data-feature="pattern">
            <div class="band ${p.band}" data-feature="armband"></div>
            <div class="back-number" data-feature="number">${p.number}</div>
          </div>
          <div class="legs ${p.boots}" data-feature="boots">
            <div class="leg l"><div class="boot"></div></div>
            <div class="leg r"><div class="boot"></div></div>
          </div>
          <div class="boot-badge ${p.boots}" data-feature="boots">
            <div class="badge-boot one"></div>
            <div class="badge-boot two"></div>
          </div>
        </div>`;
    }

    function renderDots() {
      dots.innerHTML = "";
      rounds.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.className = "dot" + (i < roundIndex ? " done" : "");
        dots.appendChild(dot);
      });
    }

    function updateScore() {
      scorePill.textContent = `${score}/${roundIndex}`;
    }

    function showEndCard() {
      finalScore.textContent = `${score}/${rounds.length}`;
      goodCount.textContent = score;
      clueCount.textContent = cluesUsed;

      if (score >= 9) {
        finalMessage.textContent = "Excellent cue decisions.";
        finalTip.textContent = "You used visual information quickly without depending only on colour.";
      } else if (score >= 6) {
        finalMessage.textContent = "Good progress.";
        finalTip.textContent = "Keep scanning for numbers, boot patterns, hair, armbands and shirt patterns.";
      } else {
        finalMessage.textContent = "Keep practising.";
        finalTip.textContent = "Do not guess colours. Slow down, press the clue, then match the strongest visual cue.";
      }

      finishOverlay.classList.remove("hidden");
    }

    function renderPlayers() {
      buttons.forEach((btn, i) => {
        const pos = positions[i];
        btn.style.setProperty("--x", `${pos.x}%`);
        btn.style.setProperty("--y", `${pos.y}%`);
        btn.className = "player-btn" + (rounds[roundIndex]?.type === "boots" ? " boot-round" : "");
        btn.innerHTML = playerHTML(currentPlayers[i]);
      });
    }

    function renderCue(target, round) {
      cueIcon.textContent = round.icon;

      if (round.type === "number") {
        cueMain.innerHTML = `<div class="cue-number">${target.number}</div>`;
        return;
      }

      if (round.type === "hair") {
        cueMain.innerHTML = `
          <div class="cue-head ${target.skin}">
            <div class="hair ${target.hair}"></div>
          </div>`;
        return;
      }

      if (round.type === "boots") {
        cueMain.innerHTML = `
          <div class="cue-boots ${target.boots}">
            <div class="boot b1"></div>
            <div class="boot b2"></div>
          </div>`;
        return;
      }

      if (round.type === "armband") {
        const side = target.band === "band-left" ? "left" : "right";
        cueMain.innerHTML = `
          <div class="cue-band ${side}">
            <div class="band-mark"></div>
          </div>`;
        return;
      }

      if (round.type === "pattern") {
        cueMain.innerHTML = `
          <div class="cue-shirt ${target.kit} ${target.pattern}">
            <div class="back-number"></div>
          </div>`;
      }
    }

    function resetBall() {
      ball.style.left = "50%";
      ball.style.top = "93%";
      ball.style.transform = "translate(-50%, -50%) scale(1)";
    }

    function clearHints() {
      buttons.forEach(btn => {
        btn.classList.remove("target-glow");
        btn.querySelectorAll(".feature-pulse").forEach(el => el.classList.remove("feature-pulse"));
      });
    }

    function showHint(countClue = true) {
      if (locked || roundIndex >= rounds.length) return;

      if (countClue && !clueUsedThisRound) {
        cluesUsed++;
        clueUsedThisRound = true;
      }

      clearHints();

      const feature = rounds[roundIndex].type;
      const targetButton = buttons[targetIndex];

      targetButton.classList.add("target-glow");

      // Pulse the matching feature on the correct player.
      targetButton
        .querySelectorAll(`[data-feature="${feature}"]`)
        .forEach(el => {
          el.classList.add("feature-pulse");

          // For boots, pulse the actual boot shapes too.
          if (feature === "boots") {
            el.querySelectorAll(".boot").forEach(boot => boot.classList.add("feature-pulse"));
          }
        });

      setTimeout(clearHints, 2600);
    }

    function showPop(symbol) {
      pop.textContent = symbol;
      pop.classList.remove("show");
      void pop.offsetWidth;
      pop.classList.add("show");
    }

    function passBallTo(btn) {
      const pitchRect = pitch.getBoundingClientRect();
      const playerRect = btn.getBoundingClientRect();

      const x = playerRect.left + playerRect.width / 2 - pitchRect.left;
      const y = playerRect.top + playerRect.height * .68 - pitchRect.top;

      ball.style.left = `${x}px`;
      ball.style.top = `${y}px`;
      ball.style.transform = "translate(-50%, -50%) scale(.86)";
    }

    function playTone(kind) {
      if (!soundOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = kind === "good" ? 660 : 155;
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.07, ctx.currentTime + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + .2);
      } catch (err) {}
    }

    function choose(index) {
      if (locked) return;

      const btn = buttons[index];

      if (index === targetIndex) {
        locked = true;
        if (!clueUsedThisRound && !wrongThisRound) {
          score++;
        }
        clearHints();
        btn.classList.add("correct", "target-glow");
        passBallTo(btn);
        showPop("✓");
        playTone("good");
        if (navigator.vibrate) navigator.vibrate(35);

        setTimeout(() => {
          roundIndex++;
          newRound();
        }, 760);
      } else {
        wrongThisRound = true;
        mistakes++;
        btn.classList.add("wrong");
        showPop("✕");
        playTone("bad");
        if (navigator.vibrate) navigator.vibrate([25, 30, 25]);

        setTimeout(() => {
          btn.classList.remove("wrong");
          showHint();
        }, 430);
      }
    }

    function newRound() {
      locked = false;
      clearHints();
      resetBall();
      renderDots();

      if (roundIndex >= rounds.length) {
        updateScore();
        showEndCard();
        return;
      }

      clueUsedThisRound = false;
      wrongThisRound = false;
      updateScore();

      const round = rounds[roundIndex];
      const selection = choosePlayersForRound(round.type);

      currentPlayers = selection.players;
      targetIndex = selection.targetIndex;

      renderPlayers();
      renderCue(currentPlayers[targetIndex], round);

      // First level makes the clue button obvious immediately.
      if (roundIndex === 0) {
        setTimeout(() => showHint(false), 400);
      }
    }

    function startGame() {
      startOverlay.classList.add("hidden");
      finishOverlay.classList.add("hidden");
      roundIndex = 0;
      score = 0;
      mistakes = 0;
      cluesUsed = 0;
      newRound();
    }

    function restartGame() {
      finishOverlay.classList.add("hidden");
      roundIndex = 0;
      score = 0;
      mistakes = 0;
      cluesUsed = 0;
      newRound();
    }

    buttons.forEach((btn, i) => btn.addEventListener("click", () => choose(i)));
    hintBtn.addEventListener("click", () => showHint(true));
    resetBtn.addEventListener("click", restartGame);
    playBtn.addEventListener("click", startGame);
    againBtn.addEventListener("click", restartGame);

    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? "🔈" : "🔇";
    });

    selfPlayer.innerHTML = playerHTML({
      number: 12,
      kit: "kit-light",
      pattern: "pattern-hoops",
      hair: "hair-flat",
      skin: "",
      boots: "boots-dots",
      band: "band-left"
    });

    renderDots();
    updateScore();

    // Preview state before pressing play.
    currentPlayers = playersPool.slice(0, 3);
    targetIndex = 0;
    renderPlayers();
    renderCue(currentPlayers[targetIndex], rounds[0]);
  </script>
</body>
</html>
